[advisories]
# zbus 5 consumers (xa11y-linux and keyring's secret-service store) still require
# these crates, now merged into zbus 6. These advisories report maintenance only.
# Review by 2026-11-25; remove when both consumers support zbus 6. Vulnerability
# advisories remain enforced, including any new advisories for these packages.
ignore = ["RUSTSEC-2026-0370", "RUSTSEC-2026-0371", "RUSTSEC-2026-0372"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]

[licenses.private]
ignore = true
registries = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
