name: Codex and Kimi compatibility canary

on:
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: codex-kimi-compatibility-canary
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  latest:
    name: Latest ${{ matrix.display_name }} against NaN
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: codex
            display_name: Codex
            doctor_id: codex
            version_command: codex --version
            test_command: cargo test -p nan-harness-cli --test conformance_codex codex_native_inventory_crosses_the_responses_bridge -- --ignored --exact
          - id: kimi
            display_name: Kimi Code
            doctor_id: kimi-code
            version_command: kimi --version
            test_command: cargo test -p nan-harness-cli --test conformance_direct kimi_code_ -- --ignored
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Install Node.js
        if: matrix.id == 'codex'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install latest Codex
        if: matrix.id == 'codex'
        run: npm install --global @openai/codex@latest

      - name: Install latest Kimi Code
        if: matrix.id == 'kimi'
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://code.kimi.com/kimi-code/install.sh \
            --output "$RUNNER_TEMP/kimi-code-install.sh"
          bash "$RUNNER_TEMP/kimi-code-install.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.kimi-code/bin" >> "$GITHUB_PATH"

      - name: Record detected version
        id: harness
        shell: bash
        run: |
          version="$(${{ matrix.version_command }} | head -n 1)"
          echo "Detected $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          printf '## %s compatibility canary\n\nDetected: `%s`\n' \
            '${{ matrix.display_name }}' "$version" >> "$GITHUB_STEP_SUMMARY"

      - name: Check compatibility diagnostics
        run: cargo run --quiet -- doctor ${{ matrix.doctor_id }}

      - name: Verify deterministic compatibility contracts
        run: cargo test --workspace

      - name: Verify native conformance
        run: ${{ matrix.test_command }}

      - name: Report a compatibility regression
        if: failure()
        uses: actions/github-script@v7
        env:
          HARNESS_NAME: ${{ matrix.display_name }}
          HARNESS_VERSION: ${{ steps.harness.outputs.version }}
        with:
          script: |
            const title = `[canary] Latest ${process.env.HARNESS_NAME} compatibility regression`;
            const body = [
              "The scheduled compatibility canary failed.",
              "",
              `- ${process.env.HARNESS_NAME}: \`${process.env.HARNESS_VERSION || "unknown"}\``,
              `- Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "- Scope: compatibility diagnostics and deterministic native conformance",
              "",
              "The workflow does not attach prompts, tool payloads, provider responses, or secrets."
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Close a recovered compatibility regression
        if: success()
        uses: actions/github-script@v7
        env:
          HARNESS_NAME: ${{ matrix.display_name }}
          HARNESS_VERSION: ${{ steps.harness.outputs.version }}
        with:
          script: |
            const title = `[canary] Latest ${process.env.HARNESS_NAME} compatibility regression`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Recovered with ${process.env.HARNESS_NAME} \`${process.env.HARNESS_VERSION || "unknown"}\` in workflow run ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed",
                state_reason: "completed"
              });
            }
