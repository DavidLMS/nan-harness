name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "web/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "AGENTS.md"
      - "LICENSE"
      - "NOTICE.md"
      - "canary/README.md"
      - "docs/**"
      - "plans/**"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    paths-ignore:
      - "web/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "AGENTS.md"
      - "LICENSE"
      - "NOTICE.md"
      - "canary/README.md"
      - "docs/**"
      - "plans/**"
      - ".github/ISSUE_TEMPLATE/**"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Rust quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-ubuntu
          cache-bin: true
      - name: Validate changelog
        run: cargo xtask changelog-check
      - name: Verify GitHub shell contracts
        run: bash .github/tests/all.sh
      - name: Verify canary host contracts
        run: bash canary/tests/all.sh
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Install interactive test dependency
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y expect
      - name: Run tests
        run: cargo test --locked --workspace --all-features
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --locked --workspace --no-deps

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Rust dependencies and tools
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-ubuntu
          cache-bin: true
      - name: Install cargo-deny
        run: |
          if ! command -v cargo-deny >/dev/null 2>&1; then
            cargo install cargo-deny --version 0.19.9 --locked
          fi
      - name: Check advisories, licenses, bans, and sources
        run: cargo deny --locked check
      - name: Check reviewed duplicate dependency paths
        run: cargo xtask dependency-check

  windows-installer:
    name: Windows security and installer lifecycle
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-windows
          cache-bin: true
      - name: Verify private filesystem ACL primitive
        run: cargo test --locked -p nan-harness-private-fs --all-features
      - name: Verify diagnostic settings and offline contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem Env:NAN_* | Remove-Item
          if (-not $env:CARGO_HOME) { $env:CARGO_HOME = Join-Path $HOME '.cargo' }
          if (-not $env:RUSTUP_HOME) { $env:RUSTUP_HOME = Join-Path $HOME '.rustup' }
          $isolatedHome = Join-Path $env:RUNNER_TEMP 'diagnostic-contracts-home'
          New-Item -ItemType Directory -Force $isolatedHome | Out-Null
          $env:HOME = $isolatedHome
          $env:USERPROFILE = $isolatedHome
          $env:APPDATA = Join-Path $isolatedHome 'appdata'
          $env:LOCALAPPDATA = Join-Path $isolatedHome 'localappdata'
          $env:NAN_HARNESS_CONFIG_DIR = Join-Path $isolatedHome 'state'
          $env:NAN_HARNESS_CREDENTIAL_BACKEND = 'file'
          function Test-ContractSuite {
            param([string[]]$CargoArguments, [string[]]$Expected)
            $inventory = & cargo test --locked @CargoArguments -- --list
            if ($LASTEXITCODE -ne 0) { throw 'Contract inventory failed' }
            $inventory | Write-Output
            foreach ($name in $Expected) {
              if ($inventory -notcontains "${name}: test") { throw "Missing contract: $name" }
            }
            & cargo test --locked @CargoArguments
            if ($LASTEXITCODE -ne 0) { throw 'Contract suite failed' }
          }
          $settingsPrefix = 'diagnostics::settings::tests::'
          $settings = @(
            'missing_settings_default_off_but_invalid_settings_fail_closed',
            'off_backs_up_exact_invalid_bytes_before_recovery_and_purge_preserves_them',
            'backup_failure_preserves_original_settings',
            'io_errors_are_not_recovered_as_corruption',
            'failed_replacement_cleans_only_owned_temporary_file',
            'abandoned_staged_settings_preserve_published_bytes',
            'settings_writers_serialize_without_taking_the_capture_lock',
            'concurrent_readers_observe_complete_old_or_new_settings',
            'temporary_published_and_backup_settings_have_private_windows_dacls',
            'windows_sharing_violation_preserves_published_bytes_and_cleans_staging'
          ) | ForEach-Object { $settingsPrefix + $_ }
          Test-ContractSuite -CargoArguments @('-p', 'nan-harness-coordinator', '--all-features', '--lib', 'diagnostics::settings::tests') -Expected $settings
          Test-ContractSuite -CargoArguments @('-p', 'nan-harness-cli', '--all-features', '--test', 'diagnostic_contracts') -Expected @(
            'settings::missing_settings_report_off_without_publishing',
            'settings::invalid_settings_require_backup_before_off_and_survive_purge',
            'settings::backup_failure_preserves_invalid_settings_and_user_owned_obstruction',
            'offline::offline_text_and_json_use_native_local_discovery_without_http_or_credentials',
            'offline::offline_missing_native_target_remains_an_error_in_text_and_json'
          )
          Test-ContractSuite -CargoArguments @('-p', 'nan-harness-cli', '--all-features', '--lib', 'offline_doctor') -Expected @(
            'tests::offline_doctor_startup_never_calls_network_or_observability_services',
            'commands::doctor::discovery::tests::offline_doctor_never_resolves_credentials_or_discovers_models'
          )
      - name: Verify runtime private temporary files
        run: cargo test --locked -p nan-harness-runtime --test temporary temporary_artifacts_are_private_and_removed_on_drop -- --exact
      - name: Verify launch-scoped profile lifecycle
        run: cargo test --locked -p nan-harness-runtime --all-features --lib temporary::tests::launch_scoped_profiles
      - name: Verify direct chat launch without the gateway
        run: cargo test --locked -p nan-harness-runtime --test supervisor supervisor_can_run_direct_chat_without_the_gateway -- --exact
      - name: Verify CLI private credentials
        run: cargo test --locked -p nan-harness-cli --all-features --lib private_credentials_use_owner_only_permissions
      - name: Verify telemetry private files
        run: cargo test --locked -p nan-harness-telemetry --test telemetry telemetry_rewrites_restore_private_file_permissions -- --exact
      - name: Verify transparent gateway integration contracts
        run: cargo test --locked -p nan-harness-bridge --test chat_completions usage::chat_bridge_counts_a_done_stream_without_usage_as_completed -- --exact
      - name: Verify provider usage propagation
        run: cargo test --locked -p nan-harness-runtime --test usage_propagation supervisor_propagates_usage_after_bridge_shutdown_cross_platform -- --exact
      - name: Verify provider usage summary output
        run: cargo test --locked -p nan-harness-cli --lib usage_summary::tests::renders_one_model_with_exact_ascii_separators -- --exact
      - name: Verify DirectChat session-token isolation
        run: cargo test --locked -p nan-harness-runtime --test supervisor supervisor_gives_direct_children_only_a_launch_scoped_session_token -- --exact
      - name: Verify child usage-evidence environment isolation
        run: cargo test --locked -p nan-harness-runtime --lib process::tests::command_cannot_reintroduce_internal_usage_file_from_launch_environment -- --exact
      - name: Verify private usage-evidence file ACL
        run: cargo test --locked -p nan-harness-cli --lib usage_evidence::tests::writes_a_private_windows_file -- --exact
      - name: Verify install and uninstall lifecycle
        run: cargo test --locked --package nan-harness-cli --test release_installer
      - name: Verify experimental Desktop contracts
        run: |
          cargo test --locked -p nan-harness-cli --lib commands::desktop::tests
          cargo test --locked -p nan-harness-cli --lib commands::chatgpt_desktop::tests
          cargo test --locked -p nan-harness-cli --lib commands::claude_desktop::tests::windows
          cargo test --locked -p nan-harness-cli --lib commands::hermes_desktop::tests::windows
      - name: Verify local Desktop compatibility registry
        run: cargo test --locked -p nan-harness-runtime --lib desktop_compatibility::tests

  macos-desktop-contracts:
    name: macOS experimental Desktop contracts
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-macos-desktop
          cache-bin: true
      - name: Verify Desktop launch and recovery contracts
        run: |
          cargo test --locked -p nan-harness-cli --lib commands::chatgpt_desktop::tests
          cargo test --locked -p nan-harness-cli --lib commands::claude_desktop::tests
          cargo test --locked -p nan-harness-cli --lib commands::hermes_desktop::tests
      - name: Verify Desktop bridges and compatibility registry
        run: |
          cargo test --locked -p nan-harness-runtime --lib codex_desktop::tests
          cargo test --locked -p nan-harness-runtime --lib claude_desktop::tests
          cargo test --locked -p nan-harness-runtime --lib desktop_compatibility::tests
      - name: Verify Claude image tool results
        run: cargo test --locked -p nan-harness-bridge --test http_bridge bridge_preserves_images_inside_tool_results -- --exact

  claude-code-conformance:
    name: Claude Code tool conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-ubuntu
          cache-bin: true
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install last compatible Claude Code
        shell: bash
        run: |
          version="$(jq -r '.harnesses[] | select(.id == "claude-code") | .lastCompatibleVersion' crates/nan-harness-runtime/resources/compatibility.json)"
          npm install --global "@anthropic-ai/claude-code@$version"
      - name: Verify tool inventory
        run: cargo test --locked -p nan-harness-cli --test conformance_claude claude_code_inventory_matches_the_conformance_manifest -- --ignored --exact
      - name: Verify deterministic tool round trips
        run: cargo test --locked -p nan-harness-cli --test conformance_claude claude_code_tools_complete_their_conformance_scenarios -- --ignored --exact
      - name: Verify external tool prerequisites
        run: cargo test --locked -p nan-harness-cli --test conformance_claude claude_code_external_tools_report_their_authentication_prerequisites -- --ignored --exact
