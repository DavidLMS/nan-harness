name: CI

on:
  push:
    paths-ignore:
      - "web/**"
  pull_request:
    paths-ignore:
      - "web/**"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Rust quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-ubuntu
          cache-bin: true
      - name: Validate changelog
        run: cargo xtask changelog-check
      - name: Verify pinned installer retries
        run: bash .github/tests/pinned-installer.sh
      - name: Verify source detector lifecycle
        run: bash .github/tests/source-main-detector.sh
      - name: Verify canary host contracts
        run: bash canary/tests/all.sh
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --workspace --all-features
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --workspace --no-deps

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Rust dependencies and tools
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-ubuntu
          cache-bin: true
      - name: Install cargo-deny
        run: |
          if ! command -v cargo-deny >/dev/null 2>&1; then
            cargo install cargo-deny --version 0.19.9 --locked
          fi
      - name: Check advisories, licenses, bans, and sources
        run: cargo deny check
      - name: Check reviewed duplicate dependency paths
        run: cargo xtask dependency-check

  windows-installer:
    name: Windows security and installer lifecycle
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-windows
          cache-bin: true
      - name: Verify private filesystem ACL primitive
        run: cargo test --locked -p nan-harness-private-fs --all-features
      - name: Verify runtime private temporary files
        run: cargo test --locked -p nan-harness-runtime --test temporary temporary_artifacts_are_private_and_removed_on_drop -- --exact
      - name: Verify direct chat launch without the gateway
        run: cargo test --locked -p nan-harness-runtime --test supervisor supervisor_can_run_direct_chat_without_the_gateway -- --exact
      - name: Verify CLI private credentials
        run: cargo test --locked -p nan-harness-cli --all-features private_credentials_use_owner_only_permissions
      - name: Verify telemetry private files
        run: cargo test --locked -p nan-harness-telemetry --test telemetry telemetry_rewrites_restore_private_file_permissions -- --exact
      - name: Verify transparent gateway integration contracts
        run: cargo test --locked -p nan-harness-bridge --test chat_completions chat_bridge_counts_a_done_stream_without_usage_as_completed -- --exact
      - name: Verify DirectChat session-token isolation
        run: cargo test --locked -p nan-harness-runtime --test supervisor supervisor_gives_direct_children_only_a_launch_scoped_session_token -- --exact
      - name: Verify child usage-evidence environment isolation
        run: cargo test --locked -p nan-harness-runtime --lib process::tests::command_cannot_reintroduce_internal_usage_file_from_launch_environment -- --exact
      - name: Verify private usage-evidence file ACL
        run: cargo test --locked -p nan-harness-cli --lib usage_evidence::tests::writes_a_private_windows_file -- --exact
      - name: Verify install and uninstall lifecycle
        run: cargo test --locked --package nan-harness-cli --test release_installer release_installer_installs_the_binary_and_alias -- --exact

  claude-code-conformance:
    name: Claude Code tool conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-ubuntu
          cache-bin: true
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install last compatible Claude Code
        shell: bash
        run: |
          version="$(jq -r '.harnesses[] | select(.id == "claude-code") | .lastCompatibleVersion' crates/nan-harness-runtime/resources/compatibility.json)"
          npm install --global "@anthropic-ai/claude-code@$version"
      - name: Verify tool inventory
        run: cargo test -p nan-harness-cli --test conformance_claude claude_code_inventory_matches_the_conformance_manifest -- --ignored --exact
      - name: Verify deterministic tool round trips
        run: cargo test -p nan-harness-cli --test conformance_claude claude_code_tools_complete_their_conformance_scenarios -- --ignored --exact
      - name: Verify external tool prerequisites
        run: cargo test -p nan-harness-cli --test conformance_claude claude_code_external_tools_report_their_authentication_prerequisites -- --ignored --exact
