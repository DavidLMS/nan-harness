name: Hosted ARM64 CLI compatibility

on:
  workflow_call:
    inputs:
      platforms:
        type: string
        default: both
      harnesses:
        type: string
        default: all
      mode:
        type: string
        default: deterministic
      source_ref:
        type: string
        default: ''
      model:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      platforms:
        description: linux, macos, or both
        type: string
        default: both
      harnesses:
        description: all or comma-separated CLI harness IDs
        type: string
        default: all
      mode:
        description: deterministic or live
        type: choice
        options: [deterministic, live]
        default: deterministic
      source_ref:
        description: Exact branch, tag, or commit to test (defaults to this SHA)
        type: string
        default: ''
      model:
        description: Bounded model identifier
        type: string
        default: ''

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      model: ${{ steps.select.outputs.model }}
      source_ref: ${{ steps.source.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: source
        env:
          REQUESTED_REF: ${{ inputs.source_ref }}
        run: |
          ref="${REQUESTED_REF:-$GITHUB_SHA}"
          if ! printf '%s' "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
            echo 'source_ref must resolve to an explicit lowercase commit SHA' >&2
            exit 1
          fi
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"
      - id: select
        env:
          PLATFORMS: ${{ inputs.platforms || 'both' }}
          HARNESSES: ${{ inputs.harnesses || 'all' }}
          MODE: ${{ inputs.mode || 'deterministic' }}
          MODEL: ${{ inputs.model || '' }}
        run: |
          if [ "$MODE" = live ] && [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            echo 'live mode is available only from explicit manual dispatch' >&2
            exit 1
          fi
          python3 canary/actions/selection.py --platforms "$PLATFORMS" \
            --harnesses "$HARNESSES" --mode "$MODE" --model "$MODEL" > matrix.json
          python3 -c 'import json; value=json.load(open("matrix.json")); print("matrix=" + json.dumps({"include": value["cells"]})); print("model=" + value["model"])' >> "$GITHUB_OUTPUT"

  cli:
    needs: select
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    environment: ${{ matrix.mode == 'live' && 'canary-live' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.source_ref }}
          persist-credentials: false
      - name: Verify checked-out source identity
        run: test -n "$(git rev-parse --verify HEAD)"
      - name: Set up fixed Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - name: Prepare bounded CLI cell inputs
        env:
          EXPECTED_SOURCE: ${{ needs.select.outputs.source_ref }}
          SYSTEM: ${{ matrix.system }}
          ARCHITECTURE: ${{ matrix.architecture }}
          HARNESS: ${{ matrix.harness }}
          MODEL: ${{ needs.select.outputs.model }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          mkdir -p "$RUNNER_TEMP/cli-cell" "$RUNNER_TEMP/cli-reports"
          cargo build --locked --release --package nan-harness-cli --bin nan-harness
          cargo build --locked --release --package nan-harness-canary --bin nan-harness-canary
          cargo metadata --no-deps --format-version 1 > "$RUNNER_TEMP/cli-metadata.json"
          nan_version="$(python3 -c 'import json,sys; data=json.load(open(sys.argv[1])); print(next(p["version"] for p in data["packages"] if p["name"] == "nan-harness-cli")' "$RUNNER_TEMP/cli-metadata.json")"
          python3 canary/actions/cli-suite.py resolve \
            --harnesses "$HARNESS" --system "$SYSTEM" --architecture "$ARCHITECTURE" \
            --model "$MODEL" --output "$RUNNER_TEMP/cli-versions.json"
          {
            echo "SOURCE_SHA=$EXPECTED_SOURCE"
            echo "NAN_VERSION=$nan_version"
            echo "BINARY_PATH=$GITHUB_WORKSPACE/target/release/nan-harness"
            echo "CANARY_PATH=$GITHUB_WORKSPACE/target/release/nan-harness-canary"
          } >> "$GITHUB_ENV"
      - name: Run isolated CLI cell
        env:
          HARNESS: ${{ matrix.harness }}
          MODE: ${{ matrix.mode }}
          MODEL: ${{ needs.select.outputs.model }}
          NAN_API_KEY: ${{ matrix.mode == 'live' && secrets.NAN_API_KEY || '' }}
        run: |
          test -n "$SOURCE_SHA"
          if [ "$MODE" = deterministic ]; then unset NAN_API_KEY; fi
          python3 canary/actions/cli-suite.py --harnesses "$HARNESS" --mode "$MODE" \
            --trigger manual --tag "v${NAN_VERSION}" --model "$MODEL" \
            --source-kind branch --source-sha "$SOURCE_SHA" --nan-version "$NAN_VERSION" \
            --system "${{ matrix.system }}" --architecture "${{ matrix.architecture }}" \
            --manifest "$RUNNER_TEMP/cli-versions.json" --binary "$BINARY_PATH" \
            --canary "$CANARY_PATH" --directory "$RUNNER_TEMP/cli-cell" \
            --output "$RUNNER_TEMP/cli-reports" --run-id "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-cell-${{ matrix.system }}-${{ matrix.harness }}
          path: ${{ runner.temp }}/cli-reports/*.json
          if-no-files-found: ignore
          retention-days: 7
