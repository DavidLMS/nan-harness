name: Temporary Windows installer diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Inspect only closed installer failure facts
        shell: python
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          import importlib.util, json, os, pathlib, sys
          sys.path.insert(0, str(pathlib.Path('canary/actions').resolve()))
          import cell
          spec = importlib.util.spec_from_file_location('suite', 'canary/actions/cli-suite.py')
          suite = importlib.util.module_from_spec(spec)
          sys.modules['suite'] = suite
          spec.loader.exec_module(suite)
          resolved, unresolved = suite.resolve_manifest(['hermes'], 'windows', 'x86_64', 'qwen3.6')
          os.environ.pop('GITHUB_TOKEN', None)
          os.environ.pop('NAN_API_KEY', None)
          if unresolved or len(resolved) != 1:
              raise RuntimeError('official metadata unavailable')
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'installer-probe'
          cell.ensure_private_directory(root)
          env = cell.cell_environment(root)
          item = resolved[0]
          code = cell.private_command(cell.installer_command('hermes', item.version, item.ref),
                                      root, allow_failure=True, environment=env)
          marker = root / 'installer-result.json'
          result = {'passed': code == 0, 'code': 'passed' if code == 0 else cell.windows_install_failure(marker, 'unknown')}
          pathlib.Path('installer-diagnostic.json').write_text(json.dumps(result))
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: installer-diagnostic
          path: installer-diagnostic.json
          if-no-files-found: error
          retention-days: 1
