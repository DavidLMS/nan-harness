name: Temporary Windows installer diagnostic
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/windows-installer-diagnostic.yml
      - canary/guest/install-harness.ps1
      - canary/actions/cell.py
      - canary/actions/temporary_installer_probe.py
permissions:
  contents: read
jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, bash]
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Inspect native installer failure facts
        if: matrix.shell == 'pwsh'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python canary/actions/temporary_installer_probe.py
      - name: Inspect Git Bash installer failure facts
        if: matrix.shell == 'bash'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python canary/actions/temporary_installer_probe.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: installer-diagnostic-${{ matrix.shell }}
          path: installer-diagnostic.json
          if-no-files-found: error
          retention-days: 1
