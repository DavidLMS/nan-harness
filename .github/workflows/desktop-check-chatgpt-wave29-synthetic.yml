name: ChatGPT Linux sandbox synthetic contracts
run-name: ChatGPT wave29 synthetic contracts

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  synthetic-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Linux subprocess fault and lifecycle contracts
        run: python3 -B scripts/test-chatgpt-wave12-install.py
      - name: Validate workflow routing and artifact boundaries
        run: python3 -B canary/tests/desktop-diagnostic-workflow.py
