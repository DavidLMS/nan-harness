name: GUI runner spike
on:
  push:
    branches: [spike/gui-runners]
    paths:
      - .github/workflows/gui-runner-spike.yml
      - experiments/gui-runner-spike/**
permissions:
  contents: read
concurrency:
  group: gui-runner-spike
  cancel-in-progress: true
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Prepare Linux desktop
        if: runner.os == 'Linux'
        uses: xa11y/setup-a11y@673fe58384fe2345d243a46d6d66b8094719e884
        with:
          package-groups: base electron
          extra-packages: libxcb-cursor0 libegl1
          setup-window-manager: 'true'
      - name: Install pinned dependencies
        working-directory: experiments/gui-runner-spike
        run: |
          python -m pip install -r requirements.txt
          npm ci
          node node_modules/electron/install.js
      - name: Configure Electron sandbox helper on Linux
        if: runner.os == 'Linux'
        working-directory: experiments/gui-runner-spike
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Run six fresh-process probes
        working-directory: experiments/gui-runner-spike
        env:
          QT_LINUX_ACCESSIBILITY_ALWAYS_ON: '1'
          QT_ACCESSIBILITY: '1'
        run: python probe.py
      - name: Upload synthetic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gui-spike-${{ matrix.os }}
          path: experiments/gui-runner-spike/results
          retention-days: 7
          if-no-files-found: warn
