name: ZCode feasibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnose isolated source installation without credentials
        shell: bash
        run: python canary/research/zcode/windows-dependencies-diagnostic.py
