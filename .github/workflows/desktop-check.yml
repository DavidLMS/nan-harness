name: Manual Desktop compatibility checks
run-name: Desktop checks - ${{ inputs.platform }} - live ${{ inputs.live }}

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native runner platform
        type: choice
        options: [linux, macos, windows]
        required: true
      app:
        description: Desktop integration
        type: choice
        options: [all, chatgpt-desktop, claude-desktop, hermes-desktop, pen-desktop, zed-desktop]
        default: all
      live:
        description: Enable bounded NaN calls using the protected environment
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    if: ${{ !inputs.live || github.ref == 'refs/heads/main' }}
    runs-on: ${{ inputs.platform == 'linux' && 'ubuntu-24.04' || inputs.platform == 'macos' && 'macos-15' || 'windows-2025' }}
    environment: ${{ inputs.live && 'canary-live' || 'desktop-deterministic' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        app: ${{ inputs.app == 'all' && fromJSON('["chatgpt-desktop","claude-desktop","hermes-desktop","pen-desktop","zed-desktop"]') || fromJSON(format('["{0}"]', inputs.app)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Prepare Linux desktop session
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb openbox x11-utils dbus-x11 at-spi2-core libxcb1 libxkbcommon0 libwayland-client0 libegl1 libvulkan1 mesa-vulkan-drivers libgtk-3-0 libnss3 libasound2t64 libgbm1 libsecret-1-0 libnotify4
      - name: Prepare official Windows installation without credentials
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SELECTED_APP: ${{ matrix.app }}
        run: ./canary/actions/prepare-desktop.ps1 -App $env:SELECTED_APP
      - name: Build official Hermes Desktop without credentials
        if: runner.os == 'Linux' && matrix.app == 'hermes-desktop'
        run: bash canary/actions/prepare-hermes-desktop.sh
      - name: Prepare published checker on Unix without credentials
        id: prepare-unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          SELECTED_APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          unset NAN_API_KEY
          mkdir -p "$RUNNER_TEMP/desktop-report"
          sh scripts/bootstrap-desktop-check.sh prepare --yes --non-interactive --ephemeral --app "$SELECTED_APP" --output "$RUNNER_TEMP/desktop-prepared.json"
          checker="$(jq -er '.checker.path' "$RUNNER_TEMP/desktop-prepared.json")"
          printf 'checker=%s\n' "$checker" >> "$GITHUB_OUTPUT"
      - name: Prepare published checker on Windows without credentials
        id: prepare-windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SELECTED_APP: ${{ matrix.app }}
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:NAN_API_KEY -ErrorAction SilentlyContinue
          $reportDirectory = Join-Path $env:RUNNER_TEMP 'desktop-report'
          New-Item -ItemType Directory -Path $reportDirectory -Force | Out-Null
          & ./scripts/bootstrap-desktop-check.ps1 prepare --yes --non-interactive --ephemeral --app $env:SELECTED_APP --output (Join-Path $env:RUNNER_TEMP 'desktop-prepared.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $receipt = Get-Content (Join-Path $env:RUNNER_TEMP 'desktop-prepared.json') -Raw | ConvertFrom-Json
          $checker = $receipt.checker.path
          if ($checker.StartsWith('\\?\')) { $checker = $checker.Substring(4) }
          "checker=$($checker.Replace('\', '/'))" >> $env:GITHUB_OUTPUT
      - name: Run deterministic checks without credentials
        env:
          CHECKER: ${{ steps.prepare-unix.outputs.checker || steps.prepare-windows.outputs.checker }}
          SELECTED_APP: ${{ matrix.app }}
        shell: bash
        run: |
          set -euo pipefail
          unset NAN_API_KEY
          bash scripts/run-desktop-check-session.sh "$CHECKER" run --yes --non-interactive --ephemeral --mode deterministic --prepared "$RUNNER_TEMP/desktop-prepared.json" --app "$SELECTED_APP" --output "$RUNNER_TEMP/desktop-report/deterministic.json"
      - name: Run bounded live checks with prepared executables
        if: inputs.live
        env:
          CHECKER: ${{ steps.prepare-unix.outputs.checker || steps.prepare-windows.outputs.checker }}
          SELECTED_APP: ${{ matrix.app }}
          NAN_API_KEY: ${{ secrets.NAN_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NAN_API_KEY" || { echo 'Live checks require the canary-live NAN_API_KEY secret.' >&2; exit 1; }
          bash scripts/run-desktop-check-session.sh "$CHECKER" run --yes --non-interactive --ephemeral --mode live --prepared "$RUNNER_TEMP/desktop-prepared.json" --app "$SELECTED_APP" --output "$RUNNER_TEMP/desktop-report/live.json"
      - name: Validate sanitized reports and print approval digests
        if: always() && (steps.prepare-unix.outputs.checker != '' || steps.prepare-windows.outputs.checker != '')
        env:
          CHECKER: ${{ steps.prepare-unix.outputs.checker || steps.prepare-windows.outputs.checker }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          reports=("$RUNNER_TEMP"/desktop-report/*.json)
          test "${#reports[@]}" -gt 0
          for report in "${reports[@]}"; do "$CHECKER" validate-report "$report"; done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: desktop-report-${{ inputs.platform }}-${{ matrix.app }}
          path: ${{ runner.temp }}/desktop-report/*.json
          if-no-files-found: error
          retention-days: 30
