name: Recommend published release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact already-published release tag
        required: true
        type: string
      tag_commit:
        description: Exact lowercase 40-character commit named by the tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-channel-${{ github.repository }}
  cancel-in-progress: false

jobs:
  recommend:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    environment: release-publication
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify trusted workflow source
        env:
          EXPECTED_WORKFLOW_COMMIT: ${{ github.sha }}
          EXPECTED_TAG: ${{ inputs.tag }}
          EXPECTED_TAG_COMMIT: ${{ inputs.tag_commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_WORKFLOW_COMMIT"
          python3 -c 'import re,sys; tag,commit=sys.argv[1:]; assert re.fullmatch(r"v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?", tag); assert re.fullmatch(r"[0-9a-f]{40}", commit)' "$EXPECTED_TAG" "$EXPECTED_TAG_COMMIT"
      - name: Recommend only the exact validated release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TAG_COMMIT: ${{ inputs.tag_commit }}
          EXPECTED_WORKFLOW_COMMIT: ${{ github.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          python3 canary/actions/release_publish.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --tag-commit "$TAG_COMMIT" \
            --workflow-commit "$EXPECTED_WORKFLOW_COMMIT" \
            --run-id "$CURRENT_RUN_ID" \
            --recommend
