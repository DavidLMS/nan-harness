name: Harness compatibility detector

on:
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-compatibility-detector
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CI: 1

jobs:
  deterministic:
    name: Latest deterministic source detector
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Build deterministic evidence tools
        run: cargo build --locked --package nan-harness-cli --bin nan-harness --package nan-harness-canary --bin nan-harness-canary
      - name: Detect latest harness conformance
        shell: bash
        run: bash .github/scripts/run-source-main-detector.sh
      - name: Upload deterministic reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-main-deterministic-reports
          path: reports/*.json
          if-no-files-found: error
          retention-days: 14
