name: Harness compatibility detector

on:
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-compatibility-detector
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CI: 1

jobs:
  deterministic:
    name: Latest deterministic source detector
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Build deterministic evidence tools
        run: cargo build --locked --package nan-harness-cli --bin nan-harness --package nan-harness-canary --bin nan-harness-canary
      - name: Detect latest harness conformance
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p reports
          nan_harness_version="$(target/debug/nan-harness --version | awk '{print $2}')"
          nan_harness_sha256="$(sha256sum target/debug/nan-harness | awk '{print $1}')"
          harnesses=(
            claude-code codex opencode hermes pi prime-agent deepseek-harness
            openclaw cline qwen-code kimi-code aider goose fx
          )
          failures=0
          for harness in "${harnesses[@]}"; do
            install_outcome=failed
            doctor_outcome=skipped
            conformance_outcome=skipped
            harness_version=unknown
            if bash .github/scripts/install-pinned-harness.sh "$harness" --latest; then
              install_outcome=success
              if doctor_report="$(target/debug/nan-harness doctor "$harness" --allow-unsupported --allow-untested --json 2>/dev/null)"; then
                doctor_outcome=success
                harness_version="$(jq -r '.version // "unknown"' <<<"$doctor_report")"
                if target/debug/nan-harness-canary conformance \
                  --nan-harness target/debug/nan-harness \
                  --harness "$harness" --json >"reports/conformance-$harness.json"; then
                  conformance_outcome=success
                else
                  conformance_outcome=failed
                fi
              else
                doctor_outcome=failed
              fi
            fi
            spec_sha256="$(printf '%s' "$harness|deterministic|source-main" | sha256sum | awk '{print $1}')"
            arguments=(
              --output "reports/$harness.json"
              --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$harness"
              --cell-id "github-$harness-deterministic"
              --spec-sha256 "$spec_sha256"
              --trigger daily
              --tier deterministic
              --scenario source-main-deterministic
              --nan-harness-version "$nan_harness_version"
              --nan-harness-source "commit:$GITHUB_SHA"
              --nan-harness-sha256 "$nan_harness_sha256"
              --operating-system linux
              --architecture "${RUNNER_ARCH:-x86_64}"
              --image ubuntu-24.04
              --profile source-main
              --harness "$harness"
              --harness-version "$harness_version"
              --check deterministic-conformance
            )
            if [ "$install_outcome" != success ]; then
              arguments+=(--failure-class installation --failure-phase install --failure-summary "latest harness installation failed")
            elif [ "$doctor_outcome" != success ]; then
              arguments+=(--failure-class harness --failure-phase doctor --failure-summary "harness diagnostics failed")
            elif [ "$conformance_outcome" != success ]; then
              arguments+=(--failure-class harness --failure-phase conformance --failure-summary "deterministic conformance failed")
            else
              arguments+=(--passed)
            fi
            if ! target/debug/nan-harness-canary record "${arguments[@]}"; then
              failures=$((failures + 1))
            fi
          done
          exit "$failures"
      - name: Upload deterministic reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-main-deterministic-reports
          path: reports/*.json
          if-no-files-found: error
          retention-days: 14
