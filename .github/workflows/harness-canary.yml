name: Daily harness compatibility

on:
  schedule:
    - cron: "0 5 * * *"
      timezone: Europe/Madrid
  workflow_dispatch:
    inputs:
      verification_only:
        description: Verify without publishing compatibility evidence
        type: boolean
        default: true
      force:
        description: Recheck current upstream versions even when already verified
        type: boolean
        default: false

permissions:
  contents: read

# Serializes feed read/merge/write with release publication and recommendation.
concurrency:
  group: release-channel-${{ github.repository }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CI: 1
  DAILY_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  prepare:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
      has_cells: ${{ steps.prepare.outputs.has_cells }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-ubuntu
      - id: prepare
        name: Select pending versions and verify signed release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || false }}
        run: |
          args=()
          if [ "$FORCE" = true ]; then args+=(--force); fi
          python3 canary/actions/daily_compatibility.py prepare \
            --directory "$RUNNER_TEMP/daily" "${args[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daily-plan-${{ github.run_attempt }}
          path: ${{ runner.temp }}/daily/plan.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.prepare.outputs.has_cells == 'true'
        with:
          name: daily-assets-${{ github.run_attempt }}
          path: ${{ runner.temp }}/daily/assets/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  cell:
    needs: prepare
    if: needs.prepare.outputs.has_cells == 'true'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    environment: compatibility-live
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: daily-plan-${{ github.run_attempt }}
          path: ${{ runner.temp }}/daily
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: daily-assets-${{ github.run_attempt }}
          path: ${{ runner.temp }}/daily/assets
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      - name: Run exact release against frozen upstream version
        env:
          NAN_API_KEY: ${{ secrets.NAN_API_KEY }}
          CELL_ID: ${{ matrix.id }}
          PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
        run: |
          "$PYTHON" canary/actions/daily_compatibility.py cell --cell "$CELL_ID" \
            --directory "$RUNNER_TEMP/daily" --reports "$RUNNER_TEMP/daily-reports"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: daily-report-${{ github.run_attempt }}-${{ matrix.id }}
          path: ${{ runner.temp }}/daily-reports/*.json
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: [prepare, cell]
    if: always() && !cancelled() && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: compatibility-publication
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: daily-plan-${{ github.run_attempt }}
          path: ${{ runner.temp }}/daily
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.prepare.outputs.has_cells == 'true'
        with:
          pattern: daily-report-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/daily-reports
          merge-multiple: true
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-ubuntu
      - name: Build trusted evidence validator
        run: cargo build --locked --package nan-harness-canary --bin nan-harness-canary
      - name: Publish independent complete harness results
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ github.event_name == 'schedule' || !inputs.verification_only }}
        run: |
          args=()
          if [ "$PUBLISH" = true ]; then args+=(--publish); fi
          python3 canary/actions/daily_compatibility.py aggregate \
            --directory "$RUNNER_TEMP/daily" --reports "$RUNNER_TEMP/daily-reports" \
            --validator "$GITHUB_WORKSPACE/target/debug/nan-harness-canary" "${args[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: daily-summary-${{ github.run_attempt }}
          path: ${{ runner.temp }}/daily/summary.json
          if-no-files-found: warn
          retention-days: 30
