name: Gentle install diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Reproduce frozen installation with closed diagnostics
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/gentle-home"
          mkdir -p "$HOME"
          export NPM_CONFIG_PREFIX="$HOME/.local"
          set +e
          npm install --global gentle-pi@4.7.0 @earendil-works/pi-coding-agent@1.5.0 > "$RUNNER_TEMP/install.log" 2>&1
          status=$?
          export INSTALL_STATUS="$status"
          python3 - <<'PY'
          import os, re, sys
          from pathlib import Path
          sys.path.insert(0, 'canary/actions')
          import cell
          path = Path(os.environ['RUNNER_TEMP']) / 'install.log'
          with path.open('rb') as log:
              print('classification:', cell.classify_install_failure(log, int(os.environ['INSTALL_STATUS'])))
          value = path.read_text(errors='replace')
          for marker in ['checksum mismatch', 'download failed', 'ETIMEDOUT', 'ECONNRESET', 'EACCES', 'ENOENT', 'EEXIST', 'ENOTEMPTY', 'SIGKILL', 'node-gyp', 'Unsupported platform', '403', '404', '429', 'GENTLE_AI_ASSET_UNAVAILABLE', 'install-gentle-ai.mjs', 'install-tui-mode-setting', 'gentle-pi', 'koffi', 'canvas', 'sharp', 'tree-sitter', 'EINTEGRITY']:
              if marker in value:
                  print('matched:', marker)
          print('exit:', os.environ['INSTALL_STATUS'])
          path.unlink()
          PY
          exit "$status"
