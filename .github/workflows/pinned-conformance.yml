name: Pinned harness conformance

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CI: 1

jobs:
  harnesses:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - name: Node A
            node: true
            harnesses: deepseek-harness openclaw codex pi
          - name: Node B
            node: true
            harnesses: claude-code cline qwen-code opencode
          - name: Hermes
            node: false
            harnesses: hermes
          - name: Python tools
            node: false
            harnesses: kimi-code aider
          - name: Native tools
            node: false
            harnesses: prime-agent goose fx
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-ubuntu
          cache-bin: true

      - name: Install Node.js
        if: matrix.node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify pinned harnesses
        shell: bash
        run: bash .github/scripts/run-pinned-conformance.sh ${{ matrix.harnesses }}
