name: Claude Code compatibility canary

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: claude-code-compatibility-canary
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  latest:
    name: Latest Claude Code against NaN
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install latest Claude Code
        run: npm install --global @anthropic-ai/claude-code@latest

      - name: Record detected Claude Code version
        id: claude
        shell: bash
        run: |
          version="$(claude --version | head -n 1)"
          echo "Detected $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          printf '## Claude Code compatibility canary\n\nDetected: `%s`\n' "$version" >> "$GITHUB_STEP_SUMMARY"

      - name: Check compatibility diagnostics
        run: cargo run --quiet -- doctor claude-code

      - name: Check whether the live secret is configured
        id: live
        shell: bash
        env:
          NAN_API_KEY: ${{ secrets.NAN_API_KEY }}
        run: |
          if [[ -n "$NAN_API_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NAN_API_KEY is not configured; live compatibility checks were skipped."
          fi

      - name: Verify deterministic compatibility contracts
        run: cargo test --workspace

      - name: Verify latest tool inventory
        run: cargo test -p nan-harness-cli --test conformance_claude claude_code_inventory_matches_the_conformance_manifest -- --ignored --exact

      - name: Verify latest deterministic tool round trips
        run: cargo test -p nan-harness-cli --test conformance_claude claude_code_tools_complete_their_conformance_scenarios -- --ignored --exact

      - name: Verify latest WebFetch round trip
        run: cargo test -p nan-harness-cli --test conformance_claude claude_code_network_tools_complete_their_conformance_scenarios -- --ignored --exact

      - name: Verify latest external tool prerequisites
        run: cargo test -p nan-harness-cli --test conformance_claude claude_code_external_tools_report_their_authentication_prerequisites -- --ignored --exact

      - name: Verify native Auto tool review
        if: steps.live.outputs.available == 'true'
        env:
          NAN_API_KEY: ${{ secrets.NAN_API_KEY }}
        run: cargo test -p nan-harness-cli --test live_claude claude_code_native_auto_mode_writes_after_qwen_review -- --ignored --exact --nocapture

      - name: Verify Plan mode isolation
        if: steps.live.outputs.available == 'true'
        env:
          NAN_API_KEY: ${{ secrets.NAN_API_KEY }}
        run: cargo test -p nan-harness-cli --test live_claude claude_code_plan_mode_remains_read_only -- --ignored --exact --nocapture

      - name: Verify subagent tool inheritance
        if: steps.live.outputs.available == 'true'
        env:
          NAN_API_KEY: ${{ secrets.NAN_API_KEY }}
        run: cargo test -p nan-harness-cli --test live_claude claude_code_subagent_inherits_the_nan_model_and_completes_a_tool_cycle -- --ignored --exact --nocapture

      - name: Report a compatibility regression
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CLAUDE_VERSION: ${{ steps.claude.outputs.version }}
        with:
          script: |
            const title = "[canary] Latest Claude Code compatibility regression";
            const body = [
              "The scheduled compatibility canary failed.",
              "",
              `- Claude Code: \`${process.env.CLAUDE_VERSION || "unknown"}\``,
              `- Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "- Scope: tool inventory, deterministic and network tool cycles, native Auto, Plan isolation, and subagent tool inheritance",
              "",
              "The workflow does not attach prompts, tool payloads, provider responses, or secrets."
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Close a recovered compatibility regression
        if: success()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CLAUDE_VERSION: ${{ steps.claude.outputs.version }}
        with:
          script: |
            const title = "[canary] Latest Claude Code compatibility regression";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Recovered with Claude Code \`${process.env.CLAUDE_VERSION || "unknown"}\` in workflow run ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed",
                state_reason: "completed"
              });
            }
