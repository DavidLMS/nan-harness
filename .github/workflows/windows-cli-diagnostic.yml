name: Native Windows CLI diagnostic

on:
  workflow_dispatch:
    inputs:
      harnesses:
        description: all or comma-separated harness identifiers
        required: true
        default: all
        type: string
      mode:
        description: credential-free native boundary diagnostic, deterministic checks, or explicitly authorized live probe
        required: true
        default: deterministic
        type: choice
        options: [native-diagnostic, deterministic, live]
      model:
        description: Bounded model identifier
        required: true
        default: qwen3.6
        type: string
      source_sha:
        description: Optional lowercase 40-character source SHA (defaults to this dispatch SHA)
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: windows-cli-diagnostic-${{ github.repository }}
  cancel-in-progress: true

jobs:
  diagnostic:
    name: Windows 2025 x64 batch diagnostic
    runs-on: windows-2025
    timeout-minutes: 120
    environment: ${{ inputs.mode == 'live' && 'canary-live' || '' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Record diagnostic timing origin
        id: timing
        run: |
          "NAN_DIAGNOSTIC_WORKFLOW_START_UTC=$((Get-Date).ToUniversalTime().ToString('o'))" >> $env:GITHUB_ENV

      - name: Check out trusted workflow source
        id: checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # These are deliberately advisory: the batch collector must still emit
      # a complete report when one setup stage is unavailable.
      - name: Install pinned Node.js
        id: node
        continue-on-error: true
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      - name: Install pinned Python
        id: python
        continue-on-error: true
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Verify trusted source identity
        id: identity
        continue-on-error: true
        if: always()
        run: |
          if (-not (Test-Path (Join-Path $env:GITHUB_WORKSPACE '.git'))) {
            throw 'trusted checkout is unavailable'
          }
          if ((git -C $env:GITHUB_WORKSPACE rev-parse HEAD) -ne $env:GITHUB_SHA) {
            throw 'trusted checkout does not match the dispatch SHA'
          }
      - name: Verify Rust toolchain
        id: rust
        continue-on-error: true
        run: rustup show

      - name: Select exact tested source SHA
        id: source
        continue-on-error: true
        if: always()
        env:
          SOURCE_SHA_INPUT: ${{ inputs.source_sha }}
        run: |
          $source = if ($env:SOURCE_SHA_INPUT) { $env:SOURCE_SHA_INPUT } else { $env:GITHUB_SHA }
          if ($source -cnotmatch '^[0-9a-f]{40}$') { throw 'source_sha must be lowercase 40-character hexadecimal' }
          git -C $env:GITHUB_WORKSPACE fetch --no-tags --depth=1 origin $source
          git -C $env:GITHUB_WORKSPACE checkout --detach $source
          if ((git -C $env:GITHUB_WORKSPACE rev-parse HEAD) -ne $source) { throw 'tested source checkout identity mismatch' }
          "TESTED_SOURCE_SHA=$source" >> $env:GITHUB_ENV

      - name: Run native Windows fixture regressions
        id: fixtures
        continue-on-error: true
        if: always()
        run: |
          if ('${{ steps.source.outcome }}' -ne 'success') {
            "NAN_DIAGNOSTIC_SETUP_FIXTURES=not-run-source-checkout" >> $env:GITHUB_ENV
            throw 'Windows fixture regressions were not run because exact source checkout failed'
          }
          if (-not (Get-Command pwsh -ErrorAction SilentlyContinue)) {
            "NAN_DIAGNOSTIC_SETUP_FIXTURES=failed-pwsh-missing" >> $env:GITHUB_ENV
            throw 'pwsh is required for Windows fixture regressions'
          }
          $output = & python -m unittest -v canary/tests/windows-diagnostic-workflow.py canary/tests/windows-diagnostic.py canary/tests/windows-summary.py canary/tests/windows-installer.py 2>&1
          $code = $LASTEXITCODE
          $output | Write-Output
          if ($code -ne 0 -or $output -match 'skipped=[1-9][0-9]*') {
            "NAN_DIAGNOSTIC_SETUP_FIXTURES=failed-python-regressions" >> $env:GITHUB_ENV
            throw "Windows Python fixture regressions failed with exit code $code or unexpected skip."
          }
          $probe = & python3 canary/tests/probe-harness-windows.py -v 2>&1
          $probeCode = $LASTEXITCODE
          $probe | Write-Output
          if ($probeCode -ne 0 -or $probe -match 'skipped=[1-9][0-9]*') {
            "NAN_DIAGNOSTIC_SETUP_FIXTURES=failed-probe-regressions" >> $env:GITHUB_ENV
            throw "Windows probe fixture regressions failed with exit code $probeCode or unexpected skip."
          }
          "NAN_DIAGNOSTIC_SETUP_FIXTURES=success" >> $env:GITHUB_ENV

      - name: Run focused Rust Windows environment fixture
        id: rust_fixture
        continue-on-error: true
        if: always()
        run: |
          if ('${{ steps.source.outcome }}' -ne 'success') {
            "NAN_DIAGNOSTIC_SETUP_RUST_FIXTURE=not-run-source-checkout" >> $env:GITHUB_ENV
            throw 'focused Rust fixture was not run because exact source checkout failed'
          }
          $filters = @(
            @{ Filter = 'conformance::environment::tests::native_child_sees_os_prerequisites_and_private_paths_only'; Name = 'environment' },
            @{ Filter = 'terminal::tests::inherited_pipe_descendants_are_killed_with_the_owned_shell'; Name = 'terminal' }
          )
          $rustFailures = @()
          foreach ($entry in $filters) {
            $filter = $entry.Filter
            $listed = @(& cargo test --locked -p nan-harness-test-support --all-features $filter -- --exact --list 2>&1)
            $listCode = $LASTEXITCODE
            $listed | Write-Output
            $matches = @($listed | Where-Object { $_ -match ': test$' })
            if ($listCode -ne 0 -or $matches.Count -ne 1) {
              $rustFailures += "$($entry.Name)-discovery"
              "focused Rust $($entry.Name) fixture discovery failed: exit=$listCode matches=$($matches.Count)" | Write-Output
              continue
            }
            & cargo test --locked -p nan-harness-test-support --all-features $filter -- --exact
            $fixtureCode = $LASTEXITCODE
            if ($fixtureCode -ne 0) {
              $rustFailures += "$($entry.Name)-exit-$fixtureCode"
              "focused Rust $($entry.Name) fixture failed with exit code $fixtureCode" | Write-Output
            }
          }
          if ($rustFailures.Count -eq 0) {
            "NAN_DIAGNOSTIC_SETUP_RUST_FIXTURE=success" >> $env:GITHUB_ENV
          } else {
            "NAN_DIAGNOSTIC_SETUP_RUST_FIXTURE=failed-$($rustFailures -join ',')" >> $env:GITHUB_ENV
            throw "focused Rust fixtures failed: $($rustFailures -join ',')"
          }

      - name: Build native diagnostic binaries
        id: build
        continue-on-error: true
        if: always()
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP 'windows-cli-build') | Out-Null
          cargo build --locked --release --package nan-harness-cli --bin nan-harness --target x86_64-pc-windows-msvc
          $cliCode = $LASTEXITCODE
          cargo build --locked --release --package nan-harness-canary --bin nan-harness-canary --target x86_64-pc-windows-msvc
          $canaryCode = $LASTEXITCODE
          "NAN_DIAGNOSTIC_BUILD_CLI=$cliCode" >> $env:GITHUB_ENV
          "NAN_DIAGNOSTIC_BUILD_CANARY=$canaryCode" >> $env:GITHUB_ENV
          if ($cliCode -ne 0 -or $canaryCode -ne 0) { exit 1 }

      - name: Run one isolated Windows diagnostic batch
        id: batch
        if: always()
        continue-on-error: true
        env:
          NAN_API_KEY: ${{ inputs.mode == 'live' && secrets.NAN_API_KEY || '' }}
          HARNESS_SELECTION: ${{ inputs.harnesses }}
          DIAGNOSTIC_MODE: ${{ inputs.mode }}
          DIAGNOSTIC_MODEL: ${{ inputs.model }}
          NAN_DIAGNOSTIC_PYTHON_VERSION: '3.12'
          REPORT_DIR: ${{ runner.temp }}\windows-cli-diagnostic
          NAN_DIAGNOSTIC_SETUP_CHECKOUT: ${{ steps.checkout.outcome }}
          NAN_DIAGNOSTIC_SETUP_NODE: ${{ steps.node.outcome }}
          NAN_DIAGNOSTIC_SETUP_PYTHON: ${{ steps.python.outcome }}
          NAN_DIAGNOSTIC_SETUP_RUST: ${{ steps.rust.outcome }}
          NAN_DIAGNOSTIC_SETUP_SOURCE: ${{ steps.source.outcome }}
          NAN_DIAGNOSTIC_SETUP_FIXTURES: ${{ env.NAN_DIAGNOSTIC_SETUP_FIXTURES || steps.fixtures.outcome }}
          NAN_DIAGNOSTIC_SETUP_RUST_FIXTURE: ${{ env.NAN_DIAGNOSTIC_SETUP_RUST_FIXTURE || steps.rust_fixture.outcome }}
          NAN_DIAGNOSTIC_SETUP_BUILD: ${{ steps.build.outcome }}
          NAN_DIAGNOSTIC_BINARY: ${{ github.workspace }}\target\x86_64-pc-windows-msvc\release\nan-harness.exe
          NAN_DIAGNOSTIC_CANARY: ${{ github.workspace }}\target\x86_64-pc-windows-msvc\release\nan-harness-canary.exe
        run: |
          $ErrorActionPreference = 'Continue'
          $source = if ($env:TESTED_SOURCE_SHA) { $env:TESTED_SOURCE_SHA } else { $env:GITHUB_SHA }
          # Derive the collector allowance from the actual job elapsed time;
          # Timing starts before checkout. Reserve two minutes for runner
          # startup plus ten minutes for summary/artifact/final-gate work;
          # setup can therefore never consume either reserve.
          $remaining = 1
          if (-not $env:NAN_DIAGNOSTIC_WORKFLOW_START_UTC) {
            Write-Output 'Diagnostic timing origin missing; forcing minimal safe batch budget.'
          } else {
            try {
              $started = [DateTimeOffset]::Parse($env:NAN_DIAGNOSTIC_WORKFLOW_START_UTC)
              $elapsed = ([DateTimeOffset]::UtcNow - $started).TotalSeconds
              $remaining = [math]::Floor(120 * 60 - $elapsed - 600 - 120)
            } catch {
              Write-Output 'Diagnostic timing origin invalid; forcing minimal safe batch budget.'
            }
          }
          if ($remaining -lt 1) { $remaining = 1 }
          $env:NAN_DIAGNOSTIC_BATCH_BUDGET = [string]([math]::Min(6000, $remaining))
          Write-Output "Diagnostic batch budget seconds: $env:NAN_DIAGNOSTIC_BATCH_BUDGET"
          New-Item -ItemType Directory -Force -Path $env:REPORT_DIR | Out-Null
          $entrypoint = Join-Path $env:GITHUB_WORKSPACE 'canary\windows-diagnostic.cmd'
          if (Test-Path $entrypoint) {
            & $entrypoint --harnesses $env:HARNESS_SELECTION --mode $env:DIAGNOSTIC_MODE `
              --model $env:DIAGNOSTIC_MODEL --python-version $env:NAN_DIAGNOSTIC_PYTHON_VERSION --budget-seconds $env:NAN_DIAGNOSTIC_BATCH_BUDGET --source-sha $source --binary $env:NAN_DIAGNOSTIC_BINARY `
              --canary $env:NAN_DIAGNOSTIC_CANARY --output $env:REPORT_DIR
            $batchCode = $LASTEXITCODE
            if ($null -eq $batchCode) { $batchCode = 1 }
            $global:LASTEXITCODE = $batchCode
          } else {
            @{ schemaVersion = 1; mode = $env:DIAGNOSTIC_MODE; sourceSha = $source;
               platform = @{ os = 'windows'; architecture = 'x64' };
               setup = @{ checkout = 'failed'; entrypoint = 'blocked' };
               harnesses = @(); totals = @{ selected = 0; passed = 0; failed = 1; blocked = 1 } } |
              ConvertTo-Json -Depth 8 | Set-Content (Join-Path $env:REPORT_DIR 'report.json')
            '# Native Windows CLI diagnostic`n`nThe batch entrypoint was unavailable.' |
              Set-Content (Join-Path $env:REPORT_DIR 'summary.md')
            $global:LASTEXITCODE = 1
          }

      - name: Ensure safe fallback report exists
        if: always()
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'windows-cli-diagnostic\report.json'
          $summary = Join-Path $env:RUNNER_TEMP 'windows-cli-diagnostic\summary.md'
          New-Item -ItemType Directory -Force -Path (Split-Path $report) | Out-Null
          if (-not (Test-Path $report)) {
            @{ schemaVersion = 1; mode = $env:DIAGNOSTIC_MODE;
               sourceSha = $env:GITHUB_SHA; platform = @{ os = 'windows'; architecture = 'x64' };
               setup = @{ workflow = 'failed'; batch = 'blocked' };
               harnesses = @(); totals = @{ selected = 0; passed = 0; failed = 1; blocked = 1 } } |
              ConvertTo-Json -Depth 8 | Set-Content $report
          }
          if (-not (Test-Path $summary)) {
            "# Native Windows CLI diagnostic`n`nNo safe batch report was produced; workflow setup or cancellation blocked collection." |
              Set-Content $summary
          }

      - name: Publish safe step summary
        if: always()
        continue-on-error: true
        run: |
          python -I (Join-Path $env:GITHUB_WORKSPACE 'canary\actions\windows_summary.py') `
            --report (Join-Path $env:RUNNER_TEMP 'windows-cli-diagnostic\report.json') `
            --output $env:GITHUB_STEP_SUMMARY

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-cli-diagnostic-${{ github.run_id }}
          path: |
            ${{ runner.temp }}\windows-cli-diagnostic\report.json
            ${{ runner.temp }}\windows-cli-diagnostic\summary.md
          if-no-files-found: warn
          retention-days: 7

      - name: Fail for failed, blocked, or unsupported required checks
        if: always()
        env:
          DIAGNOSTIC_MODE: ${{ inputs.mode }}
        run: |
          $report = Get-Content (Join-Path $env:RUNNER_TEMP 'windows-cli-diagnostic\report.json') -Raw | ConvertFrom-Json
          $bad = @($report.harnesses | Where-Object {
            $_.outcome -in @('failed', 'blocked', 'unsupported', 'incomplete') -or
            @($_.phases.PSObject.Properties.Value | Where-Object { $_.status -in @('FAIL', 'BLOCKED', 'UNSUPPORTED') }).Count -gt 0
          })
          if ($bad.Count -gt 0 -or $report.totals.failed -gt 0 -or $report.totals.blocked -gt 0) {
            throw "Windows diagnostic has $($bad.Count) failed or blocked harness result(s)."
          }
          $requiredSetup = @('checkout', 'node', 'python', 'rust', 'source', 'fixtures', 'rust_fixture', 'build')
          $setupMissing = @($requiredSetup | Where-Object {
            $property = $report.setup.PSObject.Properties[$_]
            $null -eq $property -or [string]::IsNullOrWhiteSpace([string]$property.Value)
          })
          if ($setupMissing.Count -gt 0) {
            throw "Windows diagnostic setup evidence missing: $($setupMissing -join ', ')."
          }
          $setupBad = @($report.setup.PSObject.Properties | Where-Object {
            $_.Value -notin @('success', '')
          })
          if ($setupBad.Count -gt 0) {
            throw "Windows diagnostic setup failed: $($setupBad.Name -join ', ')."
          }
          if ($env:DIAGNOSTIC_MODE -eq 'native-diagnostic' -and $report.nativePrerequisites.status -ne 'PASS') {
            throw "Native prerequisite diagnostic did not pass: $($report.nativePrerequisites.reason)."
          }
