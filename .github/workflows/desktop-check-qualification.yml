name: Desktop deterministic full qualification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-qualification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    uses: ./.github/workflows/desktop-automation-feasibility.yml
    with:
      app: all
      platform: all
      experiment: deterministic-full
      native_only: false
      quality_only: false
