name: Desktop deterministic full qualification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-qualification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.selection.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: selection
        run: echo "matrix=$(python3 canary/actions/desktop_qualification.py matrix)" >> "$GITHUB_OUTPUT"
  qualify:
    needs: select
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: matrix.backend != 'pending'
        with:
          cache-on-failure: true
      - name: Prepare macOS GUI session
        if: matrix.backend != 'pending' && (runner.os == 'macOS')
        run: bash canary/actions/prepare-desktop-macos.sh
      - name: Build neutral Quartz text input helper
        if: matrix.backend != 'pending' && matrix.app == 'zed-desktop' && (runner.os == 'macOS')
        shell: bash
        run: |
          swiftc scripts/desktop-feasibility/zed-input.swift -o "$RUNNER_TEMP/zed-neutral-input"
          echo "FEASIBILITY_ZED_INPUT_DRIVER=$RUNNER_TEMP/zed-neutral-input" >> "$GITHUB_ENV"
          echo "FEASIBILITY_ZED_INPUT_DRIVER_MODE=paste" >> "$GITHUB_ENV"
          zed_zstd_binary="$(command -v zstd)"
          echo "FEASIBILITY_ZED_ZSTD=$zed_zstd_binary" >> "$GITHUB_ENV"
          echo "FEASIBILITY_ZED_EXPORT_PARSER=$GITHUB_WORKSPACE/scripts/desktop-feasibility/zed-export.py" >> "$GITHUB_ENV"
          echo "FEASIBILITY_ZED_RESPONSE_METHOD=thread-export" >> "$GITHUB_ENV"
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        if: matrix.backend != 'pending' && matrix.app == 'zed-desktop' && runner.os == 'macOS'
        with:
          python-version: '3.11.9'
      - name: Prepare exact-source Zed icon diagnostics
        if: matrix.backend != 'pending' && matrix.app == 'zed-desktop' && runner.os == 'macOS'
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          unset NAN_API_KEY GH_TOKEN GITHUB_TOKEN
          brew install cairo
          python3 -m venv "$RUNNER_TEMP/zed-icon-build"
          "$RUNNER_TEMP/zed-icon-build/bin/python" -m pip install --disable-pip-version-check -r scripts/desktop-feasibility/zed-icon-requirements.txt
          export DYLD_FALLBACK_LIBRARY_PATH="$(brew --prefix cairo)/lib"
          export NANH_ZED_ICON_TEMPLATES="$RUNNER_TEMP/zed-icon-templates"
          "$RUNNER_TEMP/zed-icon-build/bin/python" scripts/desktop-feasibility/zed-icon-templates.py
          echo "NANH_ZED_ICON_TEMPLATES=$NANH_ZED_ICON_TEMPLATES" >> "$GITHUB_ENV"
      - name: Install Linux desktop dependencies
        if: matrix.backend != 'pending' && (runner.os == 'Linux')
        timeout-minutes: 20
        shell: bash
        run: |
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install --no-install-recommends -y cmake xvfb openbox x11-utils dbus-x11 at-spi2-core libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libegl1 libvulkan1 mesa-vulkan-drivers libgtk-3-0 libnss3 libasound2t64 libgbm1 libsecret-1-0 libnotify4
      - name: Build exact branch binaries
        if: matrix.backend != 'pending'
        run: cargo build --locked -p nan-harness-desktop-check -p nan-harness-cli --bins
      - name: Install pinned observation client
        if: matrix.backend != 'pending' && matrix.app == 'hermes-desktop'
        run: npm ci --prefix .github/web-check --ignore-scripts
      - name: Freeze authenticated public official metadata
        if: matrix.backend != 'pending'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          unset NAN_API_KEY
          freeze_args=(--tag v1.22.0)
          if [[ '${{ matrix.app }}' == hermes-desktop ]]; then
            freeze_args=(--tag v2026.9.24 --expected-revision f97608f178d1ffeca59860195ab7da295f7c8e5f)
          fi
          python3 scripts/desktop-feasibility/freeze-official.py "${freeze_args[@]}" --app '${{ matrix.app }}' --platform '${{ matrix.platform }}' --output "$RUNNER_TEMP/desktop-qualification/frozen.json"
      - name: Install exact frozen application without credentials
        if: matrix.backend != 'pending'
        env:
          FEASIBILITY_REAL_NANH: ${{ github.workspace }}/target/debug/nan-harness
          FEASIBILITY_FACTS: ${{ runner.temp }}/desktop-qualification/facts
        shell: bash
        run: |
          set -euo pipefail
          unset NAN_API_KEY GH_TOKEN GITHUB_TOKEN
          mkdir -m 700 -p "$RUNNER_TEMP/desktop-qualification/facts"
          python3 canary/actions/desktop_install.py --manifest "$RUNNER_TEMP/desktop-qualification/frozen.json" --artifacts "$RUNNER_TEMP/desktop-qualification/artifacts" --platform '${{ matrix.platform }}' --architecture '${{ matrix.architecture }}' --model qwen3.6 --harnesses '${{ matrix.app }}'
      - name: Prepare private receipt after installation environment exports
        if: matrix.backend != 'pending'
        env:
          FEASIBILITY_REAL_NANH: ${{ github.workspace }}/target/debug/nan-harness
          FEASIBILITY_FACTS: ${{ runner.temp }}/desktop-qualification/facts
        shell: bash
        run: |
          set -euo pipefail
          unset NAN_API_KEY GH_TOKEN GITHUB_TOKEN
          nanh="$FEASIBILITY_REAL_NANH"
          if [[ '${{ matrix.app }}' == hermes-desktop ]]; then nanh="$GITHUB_WORKSPACE/scripts/desktop-feasibility/nanh-shim.py"; fi
          target/debug/nanh-desktop-check prepare --app '${{ matrix.app }}' --model qwen3.6 --yes --non-interactive --ephemeral --nan-harness "$nanh" --frozen "$RUNNER_TEMP/desktop-qualification/frozen.json" --artifacts "$RUNNER_TEMP/desktop-qualification/artifacts" --output "$RUNNER_TEMP/desktop-qualification/prepared.json"
      - name: Prepare executable-scoped Hermes namespace sandbox
        if: matrix.backend != 'pending' && (runner.os == 'Linux')
        shell: bash
        run: |
          python3 scripts/desktop-feasibility/hermes-namespace.py prepare --prepared "$RUNNER_TEMP/desktop-qualification/prepared.json" --state "$RUNNER_TEMP/desktop-qualification/namespace-policy.json"
          echo 'FEASIBILITY_HERMES_NAMESPACE_POLICY=scoped-apparmor-userns' >> "$GITHUB_ENV"
      - name: Initialize explicit unqualified cell
        if: always()
        shell: bash
        run: |
          python3 canary/actions/desktop_qualification.py pending --app '${{ matrix.app }}' --platform '${{ matrix.platform }}' --architecture '${{ matrix.architecture }}' --source-sha "$GITHUB_SHA" --output "$RUNNER_TEMP/desktop-qualification/qualification.json"
      - name: Run full deterministic semantic qualification
        if: success() && matrix.backend != 'pending'
        shell: bash
        env:
          FEASIBILITY_REAL_NANH: ${{ github.workspace }}/target/debug/nan-harness
        run: |
          set -euo pipefail
          unset NAN_API_KEY GH_TOKEN GITHUB_TOKEN
          bash scripts/run-desktop-check-session.sh python3 scripts/desktop-feasibility/run-qualification.py --app '${{ matrix.app }}' --platform '${{ matrix.platform }}' --source-sha "$GITHUB_SHA" --checker "$GITHUB_WORKSPACE/target/debug/nanh-desktop-check" --real-nanh "$FEASIBILITY_REAL_NANH" --prepared "$RUNNER_TEMP/desktop-qualification/prepared.json" --frozen "$RUNNER_TEMP/desktop-qualification/frozen.json" --directory "$RUNNER_TEMP/desktop-qualification"
      - name: Reduce validated report to closed provenance
        if: always() && matrix.backend != 'pending'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/desktop-qualification/report.json" ]]; then
            launcher="$GITHUB_WORKSPACE/target/debug/nan-harness"
            if [[ '${{ matrix.app }}' == hermes-desktop ]]; then launcher="$GITHUB_WORKSPACE/scripts/desktop-feasibility/nanh-shim.py"; fi
            python3 canary/actions/desktop_qualification.py reduce --app '${{ matrix.app }}' --platform '${{ matrix.platform }}' --architecture '${{ matrix.architecture }}' --source-sha "$GITHUB_SHA" --model qwen3.6 --checker "$GITHUB_WORKSPACE/target/debug/nanh-desktop-check" --launcher "$launcher" --real-nanh "$GITHUB_WORKSPACE/target/debug/nan-harness" --prepared "$RUNNER_TEMP/desktop-qualification/prepared.json" --frozen "$RUNNER_TEMP/desktop-qualification/frozen.json" --report "$RUNNER_TEMP/desktop-qualification/report.json" --facts "$RUNNER_TEMP/desktop-qualification/qualification-facts" --output "$RUNNER_TEMP/desktop-qualification/qualification.json"
          fi
      - name: Remove owned Hermes namespace policy
        if: always() && matrix.backend == 'renderer-dom' && runner.os == 'Linux'
        shell: bash
        run: python3 scripts/desktop-feasibility/hermes-namespace.py cleanup --state "$RUNNER_TEMP/desktop-qualification/namespace-policy.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: qualification-${{ matrix.app }}-${{ matrix.platform }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/desktop-qualification/qualification.json
          if-no-files-found: error
          retention-days: 30
  acceptance:
    if: always()
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: qualification-*
          path: qualification-results
      - name: Require complete 15-cell acceptance
        run: python3 canary/actions/desktop_qualification.py aggregate --directory qualification-results --source-sha "$GITHUB_SHA" --output qualification-matrix.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: qualification-matrix
          path: qualification-matrix.json
          if-no-files-found: error
          retention-days: 30
