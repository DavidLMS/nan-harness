name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Validate release tag
        run: cargo xtask release-check "$GITHUB_REF_NAME"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --workspace --no-deps

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.9 --locked

      - name: Check dependency policy
        run: cargo deny check

      - name: Check reviewed duplicate dependency paths
        run: cargo xtask dependency-check

  pinned-conformance:
    name: Pinned harness conformance
    uses: ./.github/workflows/pinned-conformance.yml

  build:
    name: Build ${{ matrix.target }}
    needs:
      - validate
      - pinned-conformance
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            source: target/aarch64-apple-darwin/release/nan-harness
            asset: nan-harness-aarch64-apple-darwin
            canary: true
            canary_source: target/aarch64-apple-darwin/release/nan-harness-canary
            canary_asset: nan-harness-canary-aarch64-apple-darwin
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            source: target/x86_64-apple-darwin/release/nan-harness
            asset: nan-harness-x86_64-apple-darwin
            canary: false
            canary_source: ""
            canary_asset: ""
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            source: target/aarch64-unknown-linux-musl/release/nan-harness
            asset: nan-harness-aarch64-unknown-linux-musl
            canary: true
            canary_source: target/aarch64-unknown-linux-musl/release/nan-harness-canary
            canary_asset: nan-harness-canary-aarch64-unknown-linux-musl
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            source: target/x86_64-unknown-linux-musl/release/nan-harness
            asset: nan-harness-x86_64-unknown-linux-musl
            canary: false
            canary_source: ""
            canary_asset: ""
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            source: target/x86_64-pc-windows-msvc/release/nan-harness.exe
            asset: nan-harness-x86_64-pc-windows-msvc.exe
            canary: false
            canary_source: ""
            canary_asset: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Install release target
        run: rustup target add ${{ matrix.target }}

      - name: Install musl linker
        if: endsWith(matrix.target, '-linux-musl')
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Build release binary
        env:
          NAN_BUILD_COMMIT: ${{ github.sha }}
          NAN_HARNESS_GLITCHTIP_DSN: https://85d4a2350c2548f9adca4dfc5ece0653@glitchtip.edumatica.dev/1
          NAN_HARNESS_UMAMI_URL: https://umami.edumatica.dev
          NAN_HARNESS_UMAMI_WEBSITE_ID: 59cf95d9-bb3d-410d-95c5-5ac94a24b74e
          NAN_COMPATIBILITY_MANIFEST_URL: https://github.com/${{ github.repository }}/releases/download/compatibility/compatibility.json
          NAN_UPDATE_MANIFEST_URL: https://github.com/${{ github.repository }}/releases/latest/download/update-manifest.json
        run: cargo build --locked --release --package nan-harness-cli --bin nan-harness --target ${{ matrix.target }}

      - name: Build release conformance binary
        if: matrix.canary
        env:
          NAN_BUILD_COMMIT: ${{ github.sha }}
        run: cargo build --locked --release --package nan-harness-canary --bin nan-harness-canary --target ${{ matrix.target }}

      - name: Prepare release asset
        shell: bash
        run: |
          mkdir dist
          cp '${{ matrix.source }}' 'dist/${{ matrix.asset }}'
          chmod 755 'dist/${{ matrix.asset }}'
          if [ '${{ matrix.canary }}' = 'true' ]; then
            cp '${{ matrix.canary_source }}' 'dist/${{ matrix.canary_asset }}'
            chmod 755 'dist/${{ matrix.canary_asset }}'
          fi

      - name: Verify release version
        shell: bash
        run: |
          reported_version="$("./dist/${{ matrix.asset }}" --version)"
          expected_version="${GITHUB_REF_NAME#v}"
          expected_output="nan-harness $expected_version"
          if [ "$reported_version" != "$expected_output" ]; then
            printf 'Expected version output %s, got %s\n' "$expected_output" "$reported_version" >&2
            exit 1
          fi

      - name: Verify native self-update
        run: cargo test --locked --package nan-harness-cli --test self_update --target ${{ matrix.target }} self_update_replaces_a_running_copy -- --exact

      - name: Verify native release installer
        run: cargo test --locked --package nan-harness-cli --test release_installer --target ${{ matrix.target }} release_installer_installs_the_binary_and_alias -- --exact

      - name: Upload release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish ${{ github.ref_name }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Download release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Add installers and release metadata
        shell: bash
        run: |
          cp install.sh install.ps1 dist/
          chmod 755 dist/install.sh
          cargo xtask release-metadata "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" dist

      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft \
            --generate-notes \
            --title "nan-harness $version" \
            --verify-tag

      - name: Record local release gate requirement
        run: |
          printf '%s\n' '## Draft created' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'The Mac mini Tart gate must verify all harnesses before this release is published.' >> "$GITHUB_STEP_SUMMARY"
