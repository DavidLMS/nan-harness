name: Desktop semantic automation feasibility
on:
  workflow_dispatch:
    inputs:
      app:
        description: One bounded native experiment
        type: choice
        default: all
        options: [all, zed-desktop, hermes-desktop]
      quality_only:
        description: Verify integration without repeating native measurements
        type: boolean
        default: false
      native_only:
        description: Iterate native experiments; run the full gate on the final tree
        type: boolean
        default: false
      experiment:
        description: Observation mechanism to evaluate
        type: choice
        default: native-copy-dom
        options: [native-copy-dom, strict-semantic]
permissions:
  contents: read
concurrency:
  group: desktop-semantic-feasibility-${{ github.ref }}
  cancel-in-progress: false
jobs:
  select:
    if: inputs.quality_only != true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.selection.outputs.matrix }}
    steps:
      - id: selection
        env:
          SELECTED_APP: ${{ inputs.app || 'all' }}
        shell: bash
        run: |
          case "$SELECTED_APP" in
            all) echo 'matrix={"include":[{"runner":"macos-15","platform":"macos","architecture":"aarch64","app":"zed-desktop"},{"runner":"ubuntu-24.04","platform":"linux","architecture":"x86_64","app":"hermes-desktop"}]}' >> "$GITHUB_OUTPUT" ;;
            zed-desktop) echo 'matrix={"include":[{"runner":"macos-15","platform":"macos","architecture":"aarch64","app":"zed-desktop"}]}' >> "$GITHUB_OUTPUT" ;;
            hermes-desktop) echo 'matrix={"include":[{"runner":"ubuntu-24.04","platform":"linux","architecture":"x86_64","app":"hermes-desktop"}]}' >> "$GITHUB_OUTPUT" ;;
            *) exit 2 ;;
          esac
  native:
    needs: select
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Prepare macOS GUI session
        if: runner.os == 'macOS'
        run: bash canary/actions/prepare-desktop-macos.sh
      - name: Build neutral Quartz text input helper
        if: runner.os == 'macOS'
        shell: bash
        run: |
          swiftc scripts/desktop-feasibility/zed-input.swift -o "$RUNNER_TEMP/zed-neutral-input"
          echo "FEASIBILITY_ZED_INPUT_DRIVER=$RUNNER_TEMP/zed-neutral-input" >> "$GITHUB_ENV"
          echo "FEASIBILITY_ZED_INPUT_DRIVER_MODE=all" >> "$GITHUB_ENV"
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y cmake xvfb openbox x11-utils dbus-x11 at-spi2-core libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libegl1 libvulkan1 mesa-vulkan-drivers libgtk-3-0 libnss3 libasound2t64 libgbm1 libsecret-1-0 libnotify4
      - name: Build exact branch binaries
        run: cargo build --locked -p nan-harness-desktop-check -p nan-harness-cli --bins
      - name: Install pinned observation client
        if: runner.os == 'Linux'
        run: npm ci --prefix .github/web-check --ignore-scripts
      - name: Freeze authenticated public official metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          unset NAN_API_KEY
          freeze_args=(--tag v1.22.0)
          if [[ '${{ matrix.app }}' == hermes-desktop ]]; then
            freeze_args=(--tag v2026.9.24 --expected-revision f97608f178d1ffeca59860195ab7da295f7c8e5f)
          fi
          python3 scripts/desktop-feasibility/freeze-official.py "${freeze_args[@]}" --app '${{ matrix.app }}' --output "$RUNNER_TEMP/semantic-feasibility/frozen.json"
      - name: Install exact frozen application without credentials
        env:
          FEASIBILITY_REAL_NANH: ${{ github.workspace }}/target/debug/nan-harness
          FEASIBILITY_FACTS: ${{ runner.temp }}/semantic-feasibility/facts
        shell: bash
        run: |
          set -euo pipefail
          unset NAN_API_KEY GH_TOKEN GITHUB_TOKEN
          mkdir -m 700 -p "$RUNNER_TEMP/semantic-feasibility/facts"
          python3 canary/actions/desktop_install.py --manifest "$RUNNER_TEMP/semantic-feasibility/frozen.json" --artifacts "$RUNNER_TEMP/semantic-feasibility/artifacts" --platform '${{ matrix.platform }}' --architecture '${{ matrix.architecture }}' --model qwen3.6 --harnesses '${{ matrix.app }}'
      - name: Prepare private receipt after installation environment exports
        env:
          FEASIBILITY_REAL_NANH: ${{ github.workspace }}/target/debug/nan-harness
          FEASIBILITY_FACTS: ${{ runner.temp }}/semantic-feasibility/facts
        shell: bash
        run: |
          set -euo pipefail
          unset NAN_API_KEY GH_TOKEN GITHUB_TOKEN
          nanh="$FEASIBILITY_REAL_NANH"
          if [[ "$RUNNER_OS" == Linux ]]; then nanh="$GITHUB_WORKSPACE/scripts/desktop-feasibility/nanh-shim.py"; fi
          target/debug/nanh-desktop-check prepare --app '${{ matrix.app }}' --model qwen3.6 --yes --non-interactive --ephemeral --nan-harness "$nanh" --frozen "$RUNNER_TEMP/semantic-feasibility/frozen.json" --artifacts "$RUNNER_TEMP/semantic-feasibility/artifacts" --output "$RUNNER_TEMP/semantic-feasibility/prepared.json"
      - name: Prepare executable-scoped Hermes namespace sandbox
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 scripts/desktop-feasibility/hermes-namespace.py prepare --prepared "$RUNNER_TEMP/semantic-feasibility/prepared.json" --state "$RUNNER_TEMP/semantic-feasibility/namespace-policy.json"
          echo 'FEASIBILITY_HERMES_NAMESPACE_POLICY=scoped-apparmor-userns' >> "$GITHUB_ENV"
      - name: Run bounded native-copy or renderer DOM experiment
        shell: bash
        env:
          FEASIBILITY_REAL_NANH: ${{ github.workspace }}/target/debug/nan-harness
          SELECTED_EXPERIMENT: ${{ inputs.experiment }}
        run: |
          set -euo pipefail
          unset NAN_API_KEY GH_TOKEN GITHUB_TOKEN
          tag=v1.22.0
          if [[ '${{ matrix.app }}' == hermes-desktop ]]; then tag=v2026.9.24; fi
          bash scripts/run-desktop-check-session.sh python3 scripts/desktop-feasibility/run-experiments.py \
            --app '${{ matrix.app }}' --platform '${{ matrix.platform }}' --source-sha "$GITHUB_SHA" --release-tag "$tag" \
            --experiment "$SELECTED_EXPERIMENT" \
            --checker "$GITHUB_WORKSPACE/target/debug/nanh-desktop-check" --real-nanh "$FEASIBILITY_REAL_NANH" \
            --prepared "$RUNNER_TEMP/semantic-feasibility/prepared.json" --frozen "$RUNNER_TEMP/semantic-feasibility/frozen.json" \
            --directory "$RUNNER_TEMP/semantic-feasibility"
      - name: Remove owned Hermes namespace policy
        if: always() && runner.os == 'Linux'
        shell: bash
        run: python3 scripts/desktop-feasibility/hermes-namespace.py cleanup --state "$RUNNER_TEMP/semantic-feasibility/namespace-policy.json"
      - name: Present completed closed observations
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/semantic-feasibility/summary.json" ]]; then
            cat "$RUNNER_TEMP/semantic-feasibility/summary.json" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: semantic-feasibility-${{ matrix.app }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/semantic-feasibility/summary.json
          if-no-files-found: error
          retention-days: 30
  integration-quality:
    if: inputs.native_only != true
    name: Verify integrated main and desktop tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - name: Install native and interactive test dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y cmake libx11-dev libxkbcommon-dev expect
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: desktop-integration-quality
          cache-bin: true
          cache-on-failure: true
      - name: Install pinned dependency policy checker
        run: |
          if ! command -v cargo-deny >/dev/null 2>&1; then
            cargo install cargo-deny --version 0.19.9 --locked
          fi
      - name: Verify final integration tree
        run: cargo check-all
      - name: Verify semantic experiment contracts
        run: |
          for test in scripts/desktop-feasibility/test-*.py; do python3 "$test"; done
          node --check scripts/desktop-feasibility/observe-hermes.cjs
          node scripts/desktop-feasibility/test-hermes-dom.cjs
