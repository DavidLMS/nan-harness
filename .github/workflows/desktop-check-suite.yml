name: Desktop suite qualification

on:
  workflow_call:
    inputs:
      source:
        required: false
        type: string
        default: branch
      release_tag:
        required: false
        type: string
        default: ''
      platforms:
        required: false
        type: string
        default: all
      harnesses:
        required: false
        type: string
        default: all
      model:
        required: false
        type: string
        default: ''
      mode:
        required: false
        type: string
        default: deterministic
  workflow_dispatch:
    inputs:
      source:
        description: Branch binaries or exact attested release assets
        required: true
        default: branch
        type: choice
        options: [branch, release]
      release_tag:
        description: Existing vX.Y.Z release tag (required for release source)
        required: false
        default: ''
        type: string
      platforms:
        description: Comma-separated native desktop platforms
        required: true
        default: all
        type: string
      harnesses:
        description: Comma-separated desktop integrations
        required: true
        default: all
        type: string
      model:
        description: Model passed to the checker (blank uses CANARY_MODEL)
        required: false
        default: ''
        type: string
      mode:
        description: Deterministic or deterministic prerequisite plus live NaN checks
        required: true
        default: deterministic
        type: choice
        options: [deterministic, live]

permissions:
  contents: read

concurrency:
  group: desktop-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.selection.outputs.matrix }}
      model: ${{ steps.selection.outputs.model }}
      selection: ${{ steps.selection.outputs.selection }}
      release_commit: ${{ steps.selection.outputs.release_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: selection
        env:
          CANARY_MODEL: ${{ vars.CANARY_MODEL }}
          PLATFORMS: ${{ inputs.platforms }}
          HARNESSES: ${{ inputs.harnesses }}
          MODEL: ${{ inputs.model }}
          MODE: ${{ inputs.mode }}
          SOURCE: ${{ inputs.source || 'branch' }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          selected="$(python3 canary/actions/selection.py --suite desktop --platforms "${PLATFORMS:-all}" --harnesses "${HARNESSES:-all}" --mode "$MODE" --model "$MODEL")"
          [[ "$SOURCE" == branch || "$SOURCE" == release ]] || { echo 'source must be branch or release' >&2; exit 1; }
          if [[ "$SOURCE" == release && ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'release source requires an exact semantic release tag' >&2
            exit 1
          fi
          printf 'matrix=%s\n' "$(jq -c '{include: .platforms}' <<<"$selected")" >> "$GITHUB_OUTPUT"
          printf 'model=%s\n' "$(jq -er '.model' <<<"$selected")" >> "$GITHUB_OUTPUT"
          printf 'selection=%s\n' "$(jq -c . <<<"$selected")" >> "$GITHUB_OUTPUT"
          if [[ "$SOURCE" == release ]]; then
            python3 - <<'PY'
          import os, sys
          sys.path.insert(0, 'canary/actions')
          from publication import remote_commit
          from state import Store
          commit = remote_commit(Store(os.environ['GITHUB_REPOSITORY']), os.environ['RELEASE_TAG'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('release_commit=' + commit + '\n')
          PY
          fi

  desktop:
    needs: select
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    environment: ${{ inputs.mode == 'live' && 'canary-live' || 'desktop-deterministic' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: desktop-suite-${{ matrix.system }}-${{ matrix.architecture }}
          cache-workspace-crates: true
      - name: Prepare disposable macOS session
        if: runner.os == 'macOS'
        run: bash canary/actions/prepare-desktop-macos.sh
      - name: Prepare official Windows desktop installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $apps = '${{ join(matrix.harnesses, ',') }}'.Split(',')
          foreach ($app in $apps) { ./canary/actions/prepare-desktop.ps1 -App $app }
      - name: Build official Hermes Desktop
        if: runner.os == 'Linux' && contains(join(matrix.harnesses, ','), 'hermes-desktop')
        run: bash canary/actions/prepare-hermes-desktop.sh
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y cmake xvfb openbox x11-utils dbus-x11 at-spi2-core libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libegl1 libvulkan1 mesa-vulkan-drivers libgtk-3-0 libnss3 libasound2t64 libgbm1 libsecret-1-0 libnotify4
      - name: Build exact checker from selected source
        shell: bash
        run: |
          cargo build --locked -p nan-harness-desktop-check -p nan-harness-cli --bins
          checker="$GITHUB_WORKSPACE/target/debug/nanh-desktop-check"
          nanh="$GITHUB_WORKSPACE/target/debug/nan-harness"
          if [[ "$RUNNER_OS" == Windows ]]; then checker+='.exe'; nanh+='.exe'; fi
          printf 'CHECKER_PATH=%s\nNANH_PATH=%s\n' "$checker" "$nanh" >> "$GITHUB_ENV"
      - name: Verify and stage exact attested release nanh
        if: ${{ (inputs.source || 'branch') == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_COMMIT: ${{ needs.select.outputs.release_commit }}
        shell: bash
        run: |
          set -euo pipefail
          python3 canary/actions/desktop_release.py --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --platform '${{ matrix.system }}' \
            --architecture '${{ matrix.architecture }}' --directory "$RUNNER_TEMP/desktop-suite/release-assets"
      - name: Prepare apps and private receipt without credentials
        shell: bash
        env:
          NAN_API_KEY: ''
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/desktop-suite"
          checker="$CHECKER_PATH"
          nanh="$NANH_PATH"
          args=(prepare --yes --non-interactive --ephemeral --nan-harness "$nanh" --output "$RUNNER_TEMP/desktop-suite/prepared.json")
          for app in ${{ join(matrix.harnesses, ' ') }}; do args+=(--app "$app"); done
          "$checker" "${args[@]}"
      - name: Run sequential deterministic desktop apps
        shell: bash
        env:
          NAN_API_KEY: ''
          MODEL: ${{ needs.select.outputs.model }}
        run: |
          set -euo pipefail
          checker="$CHECKER_PATH"
          nanh="$NANH_PATH"
          printf '%s\n' '${{ needs.select.outputs.selection }}' > "$RUNNER_TEMP/desktop-suite/selection.json"
          bash scripts/run-desktop-check-session.sh python3 canary/actions/desktop_suite.py \
            --selection "$RUNNER_TEMP/desktop-suite/selection.json" --platform '${{ matrix.system }}' \
            --source '${{ inputs.source || 'branch' }}' --source-sha "${SOURCE_SHA:-$GITHUB_SHA}" --release-tag '${{ inputs.release_tag }}' --model "$MODEL" --checker "$checker" \
            --nan-harness "$nanh" --prepared "$RUNNER_TEMP/desktop-suite/prepared.json" \
            --output "$RUNNER_TEMP/desktop-suite/state.json" --report "$RUNNER_TEMP/desktop-suite/report-deterministic.json" \
            --stage deterministic
          "$checker" validate-report "$RUNNER_TEMP/desktop-suite/report-deterministic.json"
      - name: Run bounded live desktop apps after deterministic prerequisite
        if: ${{ inputs.mode == 'live' }}
        env:
          NAN_API_KEY: ${{ secrets.NAN_API_KEY }}
          MODEL: ${{ needs.select.outputs.model }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NAN_API_KEY" || { echo 'Live checks require canary-live NAN_API_KEY.' >&2; exit 1; }
          checker="$CHECKER_PATH"
          nanh="$NANH_PATH"
          bash scripts/run-desktop-check-session.sh python3 canary/actions/desktop_suite.py \
            --selection "$RUNNER_TEMP/desktop-suite/selection.json" --platform '${{ matrix.system }}' \
            --source '${{ inputs.source || 'branch' }}' --source-sha "${SOURCE_SHA:-$GITHUB_SHA}" --release-tag '${{ inputs.release_tag }}' --model "$MODEL" --checker "$checker" \
            --nan-harness "$nanh" --prepared "$RUNNER_TEMP/desktop-suite/prepared.json" \
            --output "$RUNNER_TEMP/desktop-suite/state.json" --report "$RUNNER_TEMP/desktop-suite/report-live.json" \
            --stage live
          "$checker" validate-report "$RUNNER_TEMP/desktop-suite/report-live.json"
      - name: Validate retained reports, including failed probes
        id: evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for report in "$RUNNER_TEMP/desktop-suite/report-deterministic.json" "$RUNNER_TEMP/desktop-suite/report-live.json"; do
            if [[ -f "$report" ]]; then
              "$CHECKER_PATH" validate-report "$report" >/dev/null 2>&1
              count=$((count + 1))
            fi
          done
          [[ "$count" -gt 0 ]]
          printf 'validated=true\n' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # Only the trusted checker report is shareable; prepared receipts and
        # runner state contain private paths and executable identities.
        if: always() && steps.evidence.outputs.validated == 'true'
        with:
          name: desktop-suite-${{ matrix.system }}
          path: ${{ runner.temp }}/desktop-suite/report-*.json
          if-no-files-found: error
          retention-days: 14
