name: Desktop suite qualification

on:
  workflow_call:
    inputs:
      source:
        required: false
        type: string
        default: branch
      release_tag:
        required: false
        type: string
        default: ''
      platforms:
        required: false
        type: string
        default: all
      harnesses:
        required: false
        type: string
        default: all
      model:
        required: false
        type: string
        default: ''
      mode:
        required: false
        type: string
        default: deterministic
      hosted_evidence:
        required: false
        type: boolean
        default: false
      diagnostics:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      source:
        description: Branch binaries or exact attested release assets
        required: true
        default: branch
        type: choice
        options: [branch, release]
      release_tag:
        description: Existing vX.Y.Z release tag (required for release source)
        required: false
        default: ''
        type: string
      platforms:
        description: Comma-separated native desktop platforms
        required: true
        default: all
        type: string
      harnesses:
        description: Comma-separated desktop integrations
        required: true
        default: all
        type: string
      model:
        description: Model passed to the checker (blank uses CANARY_MODEL)
        required: false
        default: ''
        type: string
      mode:
        description: Deterministic or deterministic prerequisite plus live NaN checks
        required: true
        default: deterministic
        type: choice
        options: [deterministic, live]
      diagnostics:
        description: Isolate each app and retain only validated diagnostic facts
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.selection.outputs.matrix }}
      model: ${{ steps.selection.outputs.model }}
      selection: ${{ steps.selection.outputs.selection }}
      release_commit: ${{ steps.selection.outputs.release_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: selection
        env:
          CANARY_MODEL: ${{ vars.CANARY_MODEL }}
          PLATFORMS: ${{ inputs.platforms }}
          HARNESSES: ${{ inputs.harnesses }}
          MODEL: ${{ inputs.model }}
          MODE: ${{ inputs.mode }}
          SOURCE: ${{ inputs.source || 'branch' }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          HOSTED_EVIDENCE: ${{ inputs.hosted_evidence }}
          DIAGNOSTICS: ${{ inputs.diagnostics }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          selected="$(python3 canary/actions/selection.py --suite desktop --platforms "${PLATFORMS:-all}" --harnesses "${HARNESSES:-all}" --mode "$MODE" --model "$MODEL")"
          [[ "$SOURCE" == branch || "$SOURCE" == release ]] || { echo 'source must be branch or release' >&2; exit 1; }
          if [[ "$HOSTED_EVIDENCE" == true && "$SOURCE" != release ]]; then
            echo 'hosted evidence requires release source' >&2
            exit 1
          fi
          if [[ "$SOURCE" == release && ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'release source requires an exact semantic release tag' >&2
            exit 1
          fi
          if [[ "$DIAGNOSTICS" == true ]]; then
            if [[ "$SOURCE" != branch || "$MODE" != deterministic || "$HOSTED_EVIDENCE" == true ]]; then
              echo 'diagnostics require credential-free branch qualification' >&2
              exit 2
            fi
            matrix=$(jq -c '{include: [.platforms[] | . as $platform | .harnesses[] | $platform + {harnesses: [.], diagnostic_app: .}]}' <<<"$selected")
          else
            matrix=$(jq -c '{include: .platforms}' <<<"$selected")
          fi
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
          printf 'model=%s\n' "$(jq -er '.model' <<<"$selected")" >> "$GITHUB_OUTPUT"
          printf 'selection=%s\n' "$(jq -c . <<<"$selected")" >> "$GITHUB_OUTPUT"
          if [[ "$SOURCE" == release ]]; then
            python3 - <<'PY'
          import os, sys
          sys.path.insert(0, 'canary/actions')
          from publication import remote_commit
          from state import Store
          commit = remote_commit(Store(os.environ['GITHUB_REPOSITORY']), os.environ['RELEASE_TAG'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('release_commit=' + commit + '\n')
          PY
          fi

  desktop:
    needs: select
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    environment: ${{ inputs.mode == 'live' && 'canary-live' || (inputs.hosted_evidence && 'desktop-deterministic' || '') }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: desktop-suite-${{ matrix.system }}-${{ matrix.architecture }}
          cache-workspace-crates: true
      - name: Prepare disposable macOS session
        if: runner.os == 'macOS'
        run: bash canary/actions/prepare-desktop-macos.sh
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y cmake xvfb openbox x11-utils dbus-x11 at-spi2-core libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libegl1 libvulkan1 mesa-vulkan-drivers libgtk-3-0 libnss3 libasound2t64 libgbm1 libsecret-1-0 libnotify4
      - name: Build exact checker from selected source
        shell: bash
        run: |
          cargo build --locked -p nan-harness-desktop-check -p nan-harness-cli --bins
          checker="$GITHUB_WORKSPACE/target/debug/nanh-desktop-check"
          nanh="$GITHUB_WORKSPACE/target/debug/nan-harness"
          if [[ "$RUNNER_OS" == Windows ]]; then checker+='.exe'; nanh+='.exe'; fi
          printf 'CHECKER_PATH=%s\nNANH_PATH=%s\n' "$checker" "$nanh" >> "$GITHUB_ENV"
      - name: Resolve exact frozen Desktop releases before preparation
        shell: bash
        run: |
          set -euo pipefail
          unset NAN_API_KEY
          mkdir -p "$RUNNER_TEMP/desktop-suite"
          args=(resolve --model '${{ needs.select.outputs.model }}' --artifacts "$RUNNER_TEMP/desktop-suite/artifacts" --output "$RUNNER_TEMP/desktop-suite/frozen.json")
          for app in ${{ join(matrix.harnesses, ' ') }}; do args+=(--app "$app"); done
          "$CHECKER_PATH" "${args[@]}"
      - name: Verify and stage exact attested release nanh
        if: ${{ (inputs.source || 'branch') == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_COMMIT: ${{ needs.select.outputs.release_commit }}
        shell: bash
        run: |
          set -euo pipefail
          python3 canary/actions/desktop_release.py --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --platform '${{ matrix.system }}' \
            --architecture '${{ matrix.architecture }}' --directory "$RUNNER_TEMP/desktop-suite/release-assets"
      - name: Validate detector feed and select pending Desktop applications
        id: pending
        if: inputs.hosted_evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cargo build --locked -p xtask --bins
          validator="$GITHUB_WORKSPACE/target/debug/xtask"
          if [[ "$RUNNER_OS" == Windows ]]; then validator+='.exe'; fi
          python3 canary/actions/detector.py feed --repository "$GITHUB_REPOSITORY" \
            --validator "$validator" --output "$RUNNER_TEMP/desktop-suite/feed.json"
          pending=$(python3 canary/actions/evidence.py select-desktop \
            --manifest "$RUNNER_TEMP/desktop-suite/frozen.json" --harnesses '${{ join(matrix.harnesses, ',') }}' \
            --feed "$RUNNER_TEMP/desktop-suite/feed.json" --feed-validator "$validator" \
            --mode '${{ inputs.mode }}' --platform '${{ matrix.system }}' --architecture '${{ matrix.architecture }}' \
            --model '${{ needs.select.outputs.model }}' --source-commit "$GITHUB_SHA" --release-tag '${{ inputs.release_tag }}' \
            --binary "$NANH_PATH" --output "$RUNNER_TEMP/desktop-suite/pending.json")
          printf 'harnesses=%s\n' "$pending" >> "$GITHUB_OUTPUT"
          jq --arg pending "$pending" --arg system '${{ matrix.system }}' \
            '.harnesses = ($pending | split(",") | map(select(length > 0))) | .platforms = [.platforms[] | select(.system == $system) | .harnesses = ($pending | split(",") | map(select(length > 0)))]' \
            <<< '${{ needs.select.outputs.selection }}' > "$RUNNER_TEMP/desktop-suite/selection.json"
      - name: Install exact external Desktop applications
        if: steps.pending.outputs.harnesses != '' || !inputs.hosted_evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 canary/actions/desktop_install.py --manifest "$RUNNER_TEMP/desktop-suite/${{ inputs.hosted_evidence && 'pending.json' || 'frozen.json' }}" \
            --artifacts "$RUNNER_TEMP/desktop-suite/artifacts" --platform '${{ matrix.system }}' \
            --architecture '${{ matrix.architecture }}' --model '${{ needs.select.outputs.model }}' \
            --harnesses '${{ steps.pending.outputs.harnesses || join(matrix.harnesses, ',') }}'
      - name: Capture and exercise Linux native helper
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p nan-harness-desktop-check -p nan-harness-cli --bins --message-format=json > "$RUNNER_TEMP/desktop-suite/build.jsonl"
          helper=$(jq -r 'select(.reason == "build-script-executed") | .env[]? | select(.[0] == "NAN_DESKTOP_NATIVE_HELPER") | .[1]' "$RUNNER_TEMP/desktop-suite/build.jsonl" | tail -n 1)
          test -n "$helper"
          export NAN_DESKTOP_NATIVE_HELPER="$helper"
          bash scripts/test-desktop-check-x11.sh "$helper"
      - name: Prepare apps and private receipt without credentials
        id: prepare
        if: steps.pending.outputs.harnesses != '' || !inputs.hosted_evidence
        shell: bash
        env:
          MODEL: ${{ needs.select.outputs.model }}
          SELECTED_HARNESSES: ${{ steps.pending.outputs.harnesses || join(matrix.harnesses, ',') }}
        run: |
          set -euo pipefail
          unset NAN_API_KEY
          mkdir -p "$RUNNER_TEMP/desktop-suite"
          checker="$CHECKER_PATH"
          nanh="$NANH_PATH"
          args=(prepare --yes --non-interactive --ephemeral --model "$MODEL" --nan-harness "$nanh" --frozen "$RUNNER_TEMP/desktop-suite/${{ inputs.hosted_evidence && 'pending.json' || 'frozen.json' }}" --artifacts "$RUNNER_TEMP/desktop-suite/artifacts" --output "$RUNNER_TEMP/desktop-suite/prepared.json")
          IFS=',' read -r -a selected_apps <<< "$SELECTED_HARNESSES"
          for app in "${selected_apps[@]}"; do args+=(--app "$app"); done
          "$checker" "${args[@]}"
      - name: Run sequential deterministic desktop apps
        shell: bash
        env:
          NAN_API_KEY: ''
          MODEL: ${{ needs.select.outputs.model }}
        if: steps.pending.outputs.harnesses != '' || !inputs.hosted_evidence
        run: |
          set -euo pipefail
          checker="$CHECKER_PATH"
          nanh="$NANH_PATH"
          if [[ ! -f "$RUNNER_TEMP/desktop-suite/selection.json" ]]; then
            jq --arg system '${{ matrix.system }}' --argjson apps '${{ toJSON(matrix.harnesses) }}' \
              '.harnesses = $apps | .platforms = [.platforms[] | select(.system == $system) | .harnesses = $apps]' \
              <<< '${{ needs.select.outputs.selection }}' > "$RUNNER_TEMP/desktop-suite/selection.json"
          fi
          bash scripts/run-desktop-check-session.sh python3 canary/actions/desktop_suite.py \
            --selection "$RUNNER_TEMP/desktop-suite/selection.json" --platform '${{ matrix.system }}' \
            --source '${{ inputs.source || 'branch' }}' --source-sha "${SOURCE_SHA:-$GITHUB_SHA}" --release-tag '${{ inputs.release_tag }}' --model "$MODEL" --checker "$checker" \
            --nan-harness "$nanh" --prepared "$RUNNER_TEMP/desktop-suite/prepared.json" \
            --output "$RUNNER_TEMP/desktop-suite/state.json" --report "$RUNNER_TEMP/desktop-suite/report-deterministic.json" \
            --stage deterministic
          "$checker" validate-report "$RUNNER_TEMP/desktop-suite/report-deterministic.json"
      - name: Run bounded live desktop apps after deterministic prerequisite
        if: ${{ always() && !cancelled() && inputs.mode == 'live' && steps.prepare.outcome == 'success' && (steps.pending.outputs.harnesses != '' || !inputs.hosted_evidence) }}
        env:
          NAN_API_KEY: ${{ secrets.NAN_API_KEY }}
          MODEL: ${{ needs.select.outputs.model }}
        shell: bash
        run: |
          set -euo pipefail
          # The driver validates per-app prerequisites before using the key.
          if [[ ! -f "$RUNNER_TEMP/desktop-suite/report-deterministic.json" ]]; then exit 0; fi
          checker="$CHECKER_PATH"
          nanh="$NANH_PATH"
          bash scripts/run-desktop-check-session.sh python3 canary/actions/desktop_suite.py \
            --selection "$RUNNER_TEMP/desktop-suite/selection.json" --platform '${{ matrix.system }}' \
            --source '${{ inputs.source || 'branch' }}' --source-sha "${SOURCE_SHA:-$GITHUB_SHA}" --release-tag '${{ inputs.release_tag }}' --model "$MODEL" --checker "$checker" \
            --nan-harness "$nanh" --prepared "$RUNNER_TEMP/desktop-suite/prepared.json" \
            --output "$RUNNER_TEMP/desktop-suite/state.json" --report "$RUNNER_TEMP/desktop-suite/report-live.json" \
            --deterministic-report "$RUNNER_TEMP/desktop-suite/report-deterministic.json" \
            --stage live
          if [[ -f "$RUNNER_TEMP/desktop-suite/report-live.json" ]]; then "$checker" validate-report "$RUNNER_TEMP/desktop-suite/report-live.json"; fi
      - name: Validate retained reports, including failed probes
        id: evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.hosted_evidence }}" == true && "${{ steps.pending.outputs.harnesses }}" == '' ]]; then printf 'validated=true\n' >> "$GITHUB_OUTPUT"; exit 0; fi
          count=0
          for report in "$RUNNER_TEMP/desktop-suite/report-deterministic.json" "$RUNNER_TEMP/desktop-suite/report-live.json"; do
            if [[ -f "$report" ]]; then
              "$CHECKER_PATH" validate-report "$report" >/dev/null 2>&1
              count=$((count + 1))
            fi
          done
          [[ "$count" -gt 0 ]]
          printf 'validated=true\n' >> "$GITHUB_OUTPUT"
      - name: Pack validated hosted evidence
        id: hosted-pack
        if: always() && inputs.hosted_evidence && steps.pending.outputs.harnesses != '' && steps.evidence.outputs.validated == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/desktop-suite/evidence"
          reports_dir="$RUNNER_TEMP/desktop-suite/validated-reports"
          mkdir -p "$reports_dir"
          cp "$RUNNER_TEMP/desktop-suite"/report-*.json "$reports_dir" 2>/dev/null || true
          python3 canary/actions/evidence.py pack --suite desktop \
            --platform '${{ matrix.system }}' --architecture '${{ matrix.architecture }}' \
            --source-commit "$GITHUB_SHA" --release-tag '${{ inputs.release_tag }}' \
            --release-commit '${{ needs.select.outputs.release_commit }}' \
            --model '${{ needs.select.outputs.model }}' --binary "$NANH_PATH" \
            --reports "$reports_dir" --validator "$CHECKER_PATH" \
            --output "$RUNNER_TEMP/desktop-suite/evidence/evidence.json"
          printf 'ready=true\n' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.hosted-pack.outputs.ready == 'true'
        with:
          name: hosted-evidence-desktop-${{ matrix.system }}
          path: ${{ runner.temp }}/desktop-suite/evidence/evidence.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # Only the trusted checker report is shareable; prepared receipts and
        # runner state contain private paths and executable identities.
        if: always() && !inputs.hosted_evidence && steps.evidence.outputs.validated == 'true'
        with:
          name: desktop-suite-${{ matrix.system }}${{ matrix.diagnostic_app && format('-{0}', matrix.diagnostic_app) || '' }}
          path: ${{ runner.temp }}/desktop-suite/report-*.json
          if-no-files-found: error
          retention-days: 14
