name: Cline Windows conformance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - canary/guest/probe-harness.ps1
      - canary/tests/probe-harness-windows.py
      - .github/workflows/cline-windows-conformance.yml
      - crates/nan-harness-adapters/**
      - crates/nan-harness-runtime/**
      - crates/nan-harness-test-support/**

permissions:
  contents: read

jobs:
  conformance:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: Verify Windows PowerShell live probe fixtures
        shell: pwsh
        run: python -m unittest -v canary/tests/probe-harness-windows.py
      - name: Build conformance binaries
        shell: pwsh
        run: cargo build --locked -p nan-harness-cli -p nan-harness-canary
      - name: Share only test executables
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cline-windows-binaries
          path: |
            target/debug/nan-harness.exe
            target/debug/nan-harness-canary.exe
          retention-days: 3
          if-no-files-found: error
      - name: Install pinned Cline
        shell: pwsh
        run: npm install --global cline@3.0.61
      - name: Verify native terminal ownership
        timeout-minutes: 5
        shell: pwsh
        run: cargo test --locked -p nan-harness-test-support --all-features terminal::windows_tests
      - name: Verify exited-parent readiness and cleanup
        timeout-minutes: 5
        shell: pwsh
        run: cargo test --locked -p nan-harness-test-support --all-features terminal::tests::parent_exits_before_inherited_pipe_cleanup -- --exact
      - name: Verify Cline contracts
        timeout-minutes: 7
        shell: pwsh
        run: |
          & target/debug/nan-harness-canary.exe conformance --nan-harness "$pwd/target/debug/nan-harness.exe" --harness cline --json
          exit $LASTEXITCODE
