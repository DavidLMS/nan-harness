name: Isolated Desktop release regression

on:
  workflow_dispatch:
    inputs:
      cell:
        description: Exact native regression cell
        type: choice
        options: [hermes-windows, hermes-macos, hermes-linux, zed-linux]
        default: hermes-windows
      tag:
        description: Exact draft release tag
        required: true
        type: string
      tag_commit:
        description: Exact lowercase 40-character commit named by the tag
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    name: Verify exact draft assets for isolated regression
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # Reading draft release assets requires this scope.
    outputs:
      manifest_sha256: ${{ steps.assets.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify trusted source and release selection
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.tag_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PYTHON_SELECTION'
          import os, sys
          sys.path.insert(0, 'canary/actions')
          from desktop_release_binding import validate_selection
          if not validate_selection(os.environ['RELEASE_TAG'], os.environ['RELEASE_COMMIT']):
              raise SystemExit('Exact draft selection is required.')
          PYTHON_SELECTION
          bash .github/scripts/check-release-tag.sh "$GITHUB_REPOSITORY" "$RELEASE_TAG" unique
      - id: assets
        name: Attest the exact native draft binary
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.tag_commit }}
          REGRESSION_CELL: ${{ inputs.cell }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'canary/actions')
          from desktop_release import stage
          from desktop_release_binding import validate_selection
          from desktop_suite import digest
          from state import Store
          tag, commit = os.environ['RELEASE_TAG'], os.environ['RELEASE_COMMIT']
          if not validate_selection(tag, commit):
              raise SystemExit('Exact draft selection is required.')
          store = Store(os.environ['GITHUB_REPOSITORY'])
          selected = subprocess.run(['gh', 'release', 'view', tag, '--repo', store.repository,
                                     '--json', 'tagName,isDraft'], stdout=subprocess.PIPE,
                                    stderr=subprocess.DEVNULL, text=True, check=True, timeout=180)
          release = json.loads(selected.stdout)
          if release.get('tagName') != tag or release.get('isDraft') is not True:
              raise SystemExit('The selected release is not the exact draft.')
          directory = Path(os.environ['RUNNER_TEMP']) / 'desktop-release-assets'
          selected = os.environ.get('REGRESSION_CELL', 'hermes-windows')
          targets = {'hermes-windows': ('windows', 'x86_64'), 'hermes-macos': ('macos', 'aarch64'),
                     'hermes-linux': ('linux', 'x86_64'), 'zed-linux': ('linux', 'x86_64')}
          if selected not in targets:
              raise SystemExit('Unsupported regression cell.')
          system, architecture = targets[selected]
          stage(store, tag, commit, system, architecture, directory)
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write('manifest_sha256=' + digest(directory / 'SHA256SUMS') + '\n')
          PYTHON
      - name: Upload attested same-run Desktop subjects
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-release-assets
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/desktop-release-assets/SHA256SUMS
            ${{ runner.temp }}/desktop-release-assets/nan-harness-*
          retention-days: 7

  qualify:
    name: Qualify isolated native Desktop cell
    needs: prepare
    uses: ./.github/workflows/desktop-automation-feasibility.yml
    with:
      release_tag: ${{ inputs.tag }}
      release_commit: ${{ inputs.tag_commit }}
      release_manifest_sha256: ${{ needs.prepare.outputs.manifest_sha256 }}
      app: ${{ inputs.cell == 'zed-linux' && 'zed-desktop' || 'hermes-desktop' }}
      platform: ${{ inputs.cell == 'hermes-windows' && 'windows' || inputs.cell == 'hermes-macos' && 'macos' || 'linux' }}
      native_only: true
      experiment: deterministic-full
