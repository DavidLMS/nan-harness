name: Bug report
description: Report a reproducible problem in nan-harness.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please remove secrets and private user
        data before submitting. Redact API keys, prompts, model output, tool
        input/output, local credentials, and private configuration.

        Run `nan doctor` and include its complete output below. The aggregate
        report is designed to exclude credentials, paths, prompts, model output,
        and private configuration, but you should still review it before posting.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
      placeholder: Clearly separate the actual result from the expected result.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest safe, deterministic sequence that reproduces the problem.
      placeholder: |
        1. Run ...
        2. Select ...
        3. Observe ...
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Include redacted logs, errors, dry-run output, or a minimal trace. Do not include secrets or private content.
      render: text

  - type: textarea
    id: doctor
    attributes:
      label: nan doctor output
      description: Run `nan doctor` and paste the complete aggregate report. Do not use `nan doctor <harness>` here because its detailed report includes a local executable path.
      placeholder: Paste the complete output of `nan doctor`.
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: nan-harness version
      description: Provide the release, commit, or package version.
      placeholder: 0.0.1 or a commit SHA
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include operating system, architecture, Rust toolchain if building from source, and installation method.
      placeholder: |
        OS and version:
        Architecture:
        Rust/toolchain:
        Installation method:
    validations:
      required: true

  - type: textarea
    id: harness
    attributes:
      label: Harness and model context
      description: If relevant, identify the harness executable/version, transport, selected model, and whether the issue occurs during discovery, launch, streaming, or native configuration.
      placeholder: |
        Harness and version:
        Transport:
        Model or capability profile:
        Lifecycle stage:

  - type: dropdown
    id: reproducibility
    attributes:
      label: Reproducibility
      options:
        - Every time
        - Often
        - Intermittent
        - Once
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues to avoid opening a duplicate.
          required: true
        - label: I tested the smallest reproduction with secrets and private data removed.
          required: true
        - label: I ran `nan doctor` and included its complete aggregate output.
          required: true
        - label: I have included enough version and environment information to reproduce the problem.
          required: true
