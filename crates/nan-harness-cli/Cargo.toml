[package]
name = "nan-harness-cli"
description = "Command-line interface for nan-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "nan-harness"
publish = false

[[bin]]
name = "nan-harness"
path = "src/main.rs"

[[bin]]
name = "nanh"
path = "src/bin/nanh.rs"

[dependencies]
clap.workspace = true
clap_complete.workspace = true
getrandom.workspace = true
jsonc-parser.workspace = true
keyring.workspace = true
nan-harness-adapters = { path = "../nan-harness-adapters", version = "0.0.20" }
nan-harness-core = { path = "../nan-harness-core", version = "0.0.20" }
nan-harness-coordinator = { path = "../nan-harness-coordinator", version = "0.0.20" }
nan-harness-diagnostics = { path = "../nan-harness-diagnostics", version = "0.0.20" }
nan-harness-private-fs = { path = "../nan-harness-private-fs", version = "0.0.20" }
nan-harness-runtime = { path = "../nan-harness-runtime", version = "0.0.20" }
nan-harness-telemetry = { path = "../nan-harness-telemetry", version = "0.0.20" }
reqwest.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
semver.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
toml_edit.workspace = true
url.workspace = true

[dev-dependencies]
nan-harness-test-support = { path = "../nan-harness-test-support", version = "0.0.20" }

[target.'cfg(target_os = "linux")'.dependencies]
nix.workspace = true

[lints]
workspace = true
