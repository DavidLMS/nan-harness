[package]
name = "nan-harness-cli"
description = "Command-line interface for nan-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "nan-harness"
publish = false

[[bin]]
name = "nan-harness"
path = "src/main.rs"

[[bin]]
name = "nanh"
path = "src/bin/nanh.rs"

[features]
# Included in release binaries; runtime activation requires explicit hosted qualification settings.
desktop-qualification = ["nan-harness-runtime/desktop-qualification", "dep:same-file"]

[dependencies]
base64.workspace = true
nan-harness-i18n = { path = "../nan-harness-i18n", version = "0.1.6" }
clap.workspace = true
clap_complete.workspace = true
getrandom.workspace = true
jsonc-parser.workspace = true
keyring.workspace = true
nan-harness-adapters = { path = "../nan-harness-adapters", version = "0.1.16" }
nan-harness-core = { path = "../nan-harness-core", version = "0.1.16" }
nan-harness-coordinator = { path = "../nan-harness-coordinator", version = "0.1.16" }
nan-harness-diagnostics = { path = "../nan-harness-diagnostics", version = "0.1.16" }
nan-harness-private-fs = { path = "../nan-harness-private-fs", version = "0.1.16" }
nan-harness-runtime = { path = "../nan-harness-runtime", version = "0.1.16" }
nan-harness-telemetry = { path = "../nan-harness-telemetry", version = "0.1.16" }
reqwest.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
semver.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
toml_edit.workspace = true
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
axum.workspace = true
nan-harness-test-support = { path = "../nan-harness-test-support", version = "0.1.16" }
# Paused virtual time keeps startup-wait tests deterministic and instant.
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs", "term"] }

[target.'cfg(windows)'.dependencies]
same-file = { version = "1.0.6", optional = true }

[target.'cfg(windows)'.dev-dependencies]
same-file = "1.0.6"

[lints]
workspace = true
