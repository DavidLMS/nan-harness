[workspace]
members = [
    "crates/nan-harness-adapters",
    "crates/nan-harness-bridge",
    "crates/nan-harness-cli",
    "crates/nan-harness-core",
    "crates/nan-harness-runtime",
    "crates/nan-harness-telemetry",
    "crates/nan-harness-test-support",
    "xtask",
]
default-members = ["crates/nan-harness-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[workspace.dependencies]
async-stream = "0.3.6"
axum = { version = "0.8.9", features = ["json"] }
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive"] }
eventsource-stream = "0.2.3"
futures-util = "0.3.34"
getrandom = "0.4.3"
nix = { version = "0.31.3", features = ["process", "signal"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
static_assertions = "1.1.0"
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
toml = "1.1.4"
zeroize = "1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_lifetimes = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
