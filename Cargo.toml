[workspace]
members = [
    "crates/nan-harness-adapters",
    "crates/nan-harness-bridge",
    "crates/nan-harness-cli",
    "crates/nan-harness-core",
    "crates/nan-harness-runtime",
    "crates/nan-harness-telemetry",
    "crates/nan-harness-test-support",
    "xtask",
]
default-members = ["crates/nan-harness-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_lifetimes = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
